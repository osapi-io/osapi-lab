---
# The lab's VMs. The name is the VM's hostname and its agent's hostname; the
# image is the Packer build it is cloned from (img-<name>-<tag> on the hub).
#
# A VM with upgrade_in_place: true is cloned one time and then kept: deploy
# bakes no new image for it and does not clone it again. The upgrade playbook
# copies each new linux build into it and restarts its agent. Thus it keeps its
# machine ID, its consumers and its job history across builds, as a host that
# runs for a long time does (osapi-io/osapi-lab#49). `just rebuild` replaces it.
lab_vms:
  - name: ubuntu-1
    image: ubuntu
  - name: debian-1
    image: debian
  - name: fedora-1
    image: fedora
  - name: opensuse-1
    image: opensuse
  - name: debian-lts
    image: debian
    upgrade_in_place: true

# --- The run ---
# playbooks/lab.yml does what lab_mode says to the VMs that lab_only names, and
# to the components that the tags of the run name. The justfile sets each from
# the words of a recipe, such as `just deploy controller debian-lts`:
#
#   deploy   bake each image that changed and replace its VM; a VM that
#            upgrades in place gets the new binary
#   bump     put the new binary into each running process; bake no image
#   rebuild  bake each image again and replace each VM, also with no change
#   restart  restart each process; no build and no copy
#   stop     stop each process, and each VM, so that launchd does not start it
#            again; nothing is removed
#   start    start each process and VM that stop stopped
lab_mode: deploy
# The tasks of each service role that the mode runs: main brings it to the
# checkout and restarts it as needed; stop and start only stop and start it.
lab_entry: "{{ lab_mode if lab_mode in ['stop', 'start'] else 'main' }}"
# A comma list of VM names, such as ubuntu-1,debian-lts. Empty is each VM.
lab_only: ""
lab_only_vms: "{{ lab_only.split(',') | map('trim') | select | list }}"
lab_targets: "{{ (lab_vms | selectattr('name', 'in', lab_only_vms) | list) if lab_only_vms else lab_vms }}"
lab_in_place: >-
  {{ lab_vms | selectattr('upgrade_in_place', 'defined') | selectattr('upgrade_in_place')
     | map(attribute='name') | list }}
# What the run does to each VM of lab_targets. A VM that upgrades in place is
# in lab_replace_vms of a deploy too: lab_images and lab_vm make it only when it
# does not exist, and lab_update_vms gives it the new binary.
lab_replace_vms: "{{ lab_targets if lab_mode in ['deploy', 'rebuild'] else [] }}"
lab_update_vms: >-
  {{ lab_targets if lab_mode == 'bump'
     else (lab_targets | selectattr('name', 'in', lab_in_place) | list) if lab_mode == 'deploy'
     else [] }}
lab_restart_vms: "{{ lab_targets if lab_mode == 'restart' else [] }}"
# Whether the tags of the run reach the VMs: with no tags, each component runs.
lab_vms_in_scope: "{{ 'all' in ansible_run_tags or 'vms' in ansible_run_tags }}"

# Images built by packer/lab.pkr.hcl. Ubuntu and Debian are osapi's debian
# platform; anything else gets IGNORE_LINUX so the agent starts at all.
lab_debian_family: [ubuntu, debian]

# The repository root and its gitignored state, on the machine running Ansible.
lab_root: "{{ playbook_dir | dirname | dirname }}"
lab_state: "{{ lab_root }}/.lab"
lab_ssh_key: "{{ lab_state }}/ssh/id_ed25519"

# The account the Cirrus Labs base images ship with, and that the seed of a
# base under packer/bases makes.
lab_vm_user: admin

# Every osapi process in the lab uses osapi's default ports and namespace.
lab_nats_port: 4222
lab_api_port: 8080

# The lab's secrets, one file each under .lab/secrets/ on the machine running
# Ansible. The secrets role creates them; nothing else writes them. Lookups are
# lazy, so these resolve only where a template or task uses them.
lab_secrets_dir: "{{ lab_state }}/secrets"
lab_signing_key: "{{ lookup('ansible.builtin.file', lab_secrets_dir ~ '/signing_key') }}"
lab_token: "{{ lookup('ansible.builtin.file', lab_secrets_dir ~ '/token') }}"

# controller.api.security.signing_keys of the hub and of cli.yaml. The first
# key signs each token and puts its id in the token's kid; each key verifies the
# tokens with its id. To change the key, put a new one first, and remove the old
# one when its tokens expire.
lab_signing_keys:
  - id: lab
    key: "{{ lab_signing_key }}"

# NATS runs in operator (decentralized JWT) mode. The hub makes its operator,
# its accounts and a credentials file for each osapi role with `osapi nats
# auth operator create`, in lab_hub_nats_dir. An agent gets its own user at
# its join; the controller mints it. lab_nats_creds_dir on this machine holds
# the copy of a credential that a tool here uses, such as the nats CLI.
lab_nats_creds_dir: "{{ lab_secrets_dir }}/nats"
lab_hub_nats_dir: "{{ lab_hub_state_abs }}/nats"
# Where a VM reaches NATS in its join string: the gateway of tart's network,
# in place of the tailnet name of the controller's join URL. The agent checks
# the hub's certificate for its tailnet name.
lab_vm_nats_url: tls://192.168.64.1:{{ lab_nats_port }}
# How long a join token of an image admits its VM, which joins at its first
# boot, minutes after the bake.
lab_join_expires: 24h

# Jaeger on the hub collects every process's traces: the controller, NATS and
# each agent send OTLP over gRPC to the OTLP port, and the UI is on the UI port.
# One collector, because one trace runs from the controller through NATS to an
# agent.
lab_tracing_version: 2.22.0
lab_tracing_url: https://github.com/jaegertracing/jaeger/releases/download/v{{ lab_tracing_version }}/jaeger-{{ lab_tracing_version }}-darwin-arm64.tar.gz
lab_tracing_archive_sha256: 856f82c353833d85d144e2bb59ecf1156bb431d62748d62e59360b5bdc00fc63
lab_tracing_otlp_port: 4317
lab_tracing_ui_port: 16686

# Where a person opens the controller, the trace UI and NATS, as health shows
# them beside each bind address. They default to the hub's address on this
# machine (lab_hub_addr, from the inventory); set any of them in the inventory
# to show a different location. The metrics servers answer the hub only, so
# they get none.
lab_controller_url: https://{{ lab_hub_addr }}:8080/
lab_tracing_view_url: https://{{ lab_hub_addr }}:{{ lab_tracing_ui_port }}/
lab_nats_url: tls://{{ lab_hub_addr }}:{{ lab_nats_port }}

# The hub, as the plays that run elsewhere refer to it.
lab_hub: "{{ groups['hub'][0] }}"

# lab_hub_state with ~ expanded, for plays on the hub that gathered facts.
lab_hub_state_abs: "{{ lab_hub_state | regex_replace('^~', ansible_facts.env.HOME) }}"
# The osapi CLI on the hub, with the hub's config: each play that asks the
# controller something, such as `client agent list`, calls it.
lab_hub_cli:
  - "{{ lab_hub_state_abs }}/bin/osapi-darwin-arm64"
  - -f
  - "{{ lab_hub_state_abs }}/config/hub.yaml"

# The last build's tag (short commit, -dirty for uncommitted changes) and its
# description, from .lab/bin. Images are named img-<image>-<tag>; the img-
# prefix keeps them apart from the VMs, lab-<name>.
# Empty when nothing has been built here yet.
#
# These describe the linux build, which the images and the VMs run. The build
# role builds each OS only when a run needs it, so the darwin build has a record
# of its own, lab_hub_build_revision.
lab_build_tag: "{{ lookup('ansible.builtin.file', lab_state ~ '/bin/linux.TAG', errors='ignore') | default('', true) }}"
lab_build_revision: "{{ lookup('ansible.builtin.file', lab_state ~ '/bin/linux.REVISION', errors='ignore') | default('', true) }}"
lab_hub_build_revision: "{{ lookup('ansible.builtin.file', lab_state ~ '/bin/darwin.REVISION', errors='ignore') | default('', true) }}"
# Changes with any change to the source, dirty trees included. An image and a
# VM record the fingerprint they were made from, so a run rebuilds or reclones
# only what is out of date.
lab_build_fingerprint: "{{ lookup('ansible.builtin.file', lab_state ~ '/bin/linux.FINGERPRINT', errors='ignore') | default('', true) }}"

# PATH for commands on the hub. A non-interactive SSH session on a Mac has no
# Homebrew or mise on PATH. Until facts are gathered (the gathering itself runs
# with the play's environment) the system PATH is enough.
lab_hub_path_dirs:
  - "{{ ansible_facts.env.HOME }}/.local/bin"
  - "{{ ansible_facts.env.HOME }}/.homebrew/bin"
  - /opt/homebrew/bin
  - /usr/local/bin
lab_hub_path: >-
  {{ ((lab_hub_path_dirs + [ansible_facts.env.PATH]) | join(':'))
     if 'env' in ansible_facts else '/usr/bin:/bin:/usr/sbin:/sbin' }}

# The Tailscale CLI on the hub, which issues the API's certificate.
lab_tailscale_cli: /Applications/Tailscale.app/Contents/MacOS/Tailscale
