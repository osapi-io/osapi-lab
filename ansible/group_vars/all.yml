---
# The lab's VMs. The name is the VM's hostname and its agent's hostname; the
# image is the Packer build it is cloned from (img-<name>-<tag> on the hub).
#
# A VM with upgrade_in_place: true is cloned one time and then kept: deploy
# bakes no new image for it and does not clone it again. The upgrade playbook
# copies each new linux build into it and restarts its agent. Thus it keeps its
# machine ID, its consumers and its job history across builds, as a host that
# runs for a long time does (osapi-io/osapi-lab#49). `just rebuild` replaces it.
lab_vms:
  - name: ubuntu-1
    image: ubuntu
  - name: debian-1
    image: debian
  - name: fedora-1
    image: fedora
  - name: opensuse-1
    image: opensuse
  - name: debian-lts
    image: debian
    upgrade_in_place: true

# Images built by packer/lab.pkr.hcl. Ubuntu and Debian are osapi's debian
# platform; anything else gets IGNORE_LINUX so the agent starts at all.
lab_debian_family: [ubuntu, debian]

# The repository root and its gitignored state, on the machine running Ansible.
lab_root: "{{ playbook_dir | dirname | dirname }}"
lab_state: "{{ lab_root }}/.lab"
lab_ssh_key: "{{ lab_state }}/ssh/id_ed25519"

# The account the Cirrus Labs base images ship with, and that the seed of a
# base under packer/bases makes.
lab_vm_user: admin

# Every osapi process in the lab uses osapi's default ports and namespace.
lab_nats_port: 4222
lab_api_port: 8080

# The lab's secrets, one file each under .lab/secrets/ on the machine running
# Ansible. The secrets role creates them; nothing else writes them. Lookups are
# lazy, so these resolve only where a template or task uses them.
lab_secrets_dir: "{{ lab_state }}/secrets"
lab_signing_key: "{{ lookup('ansible.builtin.file', lab_secrets_dir ~ '/signing_key') }}"
lab_token: "{{ lookup('ansible.builtin.file', lab_secrets_dir ~ '/token') }}"
lab_agent_dummy_key: "{{ lookup('ansible.builtin.file', lab_secrets_dir ~ '/agent_dummy_key') }}"

# NATS runs in operator (decentralized JWT) mode, as a NATS someone already runs
# would. nsc keeps the operator, its accounts and their keys here, and each NATS
# user's credentials file, one per osapi process, goes in lab_nats_creds_dir.
lab_nsc_dir: "{{ lab_secrets_dir }}/nsc"
lab_nats_creds_dir: "{{ lab_secrets_dir }}/nats"
lab_nsc_env:
  NSC_HOME: "{{ lab_nsc_dir }}/home"
  NKEYS_PATH: "{{ lab_nsc_dir }}/keys"
# The account osapi's users belong to, and its JWT once nsc has made it.
lab_nats_account: osapi
lab_nats_resolver: "{{ lab_secrets_dir }}/resolver.conf"

# Jaeger on the hub collects every process's traces: the controller, NATS and
# each agent send OTLP over gRPC to the OTLP port, and the UI is on the UI port.
# One collector, because one trace runs from the controller through NATS to an
# agent.
lab_tracing_version: 2.22.0
lab_tracing_url: https://github.com/jaegertracing/jaeger/releases/download/v{{ lab_tracing_version }}/jaeger-{{ lab_tracing_version }}-darwin-arm64.tar.gz
lab_tracing_archive_sha256: 856f82c353833d85d144e2bb59ecf1156bb431d62748d62e59360b5bdc00fc63
lab_tracing_otlp_port: 4317
lab_tracing_ui_port: 16686

# Where a person opens the controller, the trace UI and NATS, as health shows
# them beside each bind address. They default to the hub's address on this
# machine (lab_hub_addr, from the inventory); set any of them in the inventory
# to show a different location. The metrics servers answer the hub only, so
# they get none.
lab_controller_url: http://{{ lab_hub_addr }}:8080/
lab_tracing_view_url: http://{{ lab_hub_addr }}:{{ lab_tracing_ui_port }}/
lab_nats_url: nats://{{ lab_hub_addr }}:{{ lab_nats_port }}

# The hub, as the plays that run elsewhere refer to it.
lab_hub: "{{ groups['hub'][0] }}"

# lab_hub_state with ~ expanded, for plays on the hub that gathered facts.
lab_hub_state_abs: "{{ lab_hub_state | regex_replace('^~', ansible_facts.env.HOME) }}"

# The last build's tag (short commit, -dirty for uncommitted changes) and its
# description, from .lab/bin. Images are named img-<image>-<tag>; the img-
# prefix keeps them apart from the VMs, lab-<name>.
# Empty when nothing has been built here yet.
lab_build_tag: "{{ lookup('ansible.builtin.file', lab_state ~ '/bin/TAG', errors='ignore') | default('', true) }}"
lab_build_revision: "{{ lookup('ansible.builtin.file', lab_state ~ '/bin/REVISION', errors='ignore') | default('', true) }}"
# Changes with any change to the source, dirty trees included. An image and a
# VM record the fingerprint they were made from, so a run rebuilds or reclones
# only what is out of date.
lab_build_fingerprint: "{{ lookup('ansible.builtin.file', lab_state ~ '/bin/FINGERPRINT', errors='ignore') | default('', true) }}"

# PATH for commands on the hub. A non-interactive SSH session on a Mac has no
# Homebrew or mise on PATH. Until facts are gathered (the gathering itself runs
# with the play's environment) the system PATH is enough.
lab_hub_path_dirs:
  - "{{ ansible_facts.env.HOME }}/.local/bin"
  - "{{ ansible_facts.env.HOME }}/.homebrew/bin"
  - /opt/homebrew/bin
  - /usr/local/bin
lab_hub_path: >-
  {{ ((lab_hub_path_dirs + [ansible_facts.env.PATH]) | join(':'))
     if 'env' in ansible_facts else '/usr/bin:/bin:/usr/sbin:/sbin' }}
