# Ansible reads this file from the current directory, so every playbook runs
# from ansible/:  cd ansible && uv run ansible-playbook playbooks/<name>.yml
# Relative paths here resolve against this file's directory.

[defaults]
inventory = inventory.yml
roles_path = roles
callback_result_format = yaml
retry_files_enabled = False
interpreter_python = auto_silent
# Facts only under ansible_facts, never as top-level variables.
inject_facts_as_vars = False
# The VMs are recloned from images and get new host keys each time.
host_key_checking = False

[ssh_connection]
pipelining = True
