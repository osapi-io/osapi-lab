# Ansible reads this file from the current directory, so every playbook runs
# from ansible/:  cd ansible && uv run ansible-playbook playbooks/<name>.yml
# Relative paths here resolve against this file's directory.

[defaults]
inventory = inventory.yml
roles_path = roles
callback_result_format = yaml
retry_files_enabled = False
interpreter_python = auto_silent
# Facts only under ansible_facts, never as top-level variables.
inject_facts_as_vars = False
# SSH checks each host key. The hub's key is recorded at the first connection
# (group_vars/hub.yml) and refused if it changes later. The VMs get new host
# keys at each reclone, so their connections turn the check off for the VM only
# (vm_inventory, lab_vm, client's ssh_config); the jump to the hub still checks.
host_key_checking = True

[ssh_connection]
pipelining = True
