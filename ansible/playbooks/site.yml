---
# Everything, from nothing: a build, the secrets, the hub, the images, the VMs
# and their agents, and the configs on this machine. Safe to run again.
- name: Build
  ansible.builtin.import_playbook: build.yml
- name: Secrets
  ansible.builtin.import_playbook: secrets.yml
- name: Hub
  ansible.builtin.import_playbook: hub.yml
- name: Images
  ansible.builtin.import_playbook: images.yml
- name: VMs
  ansible.builtin.import_playbook: vms.yml
- name: Agents
  ansible.builtin.import_playbook: agents.yml
- name: Client
  ansible.builtin.import_playbook: client.yml
