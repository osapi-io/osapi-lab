---
# The hub's recent NATS and controller logs. Changes nothing.
- name: Logs
  hosts: hub
  gather_facts: false
  tasks:
    - name: Read the last lines of each log
      ansible.builtin.command: tail -n {{ lab_log_lines | default(40) }} {{ lab_hub_state }}/log/{{ item }}.log
      loop: [nats, controller]
      register: logs_out
      changed_when: false
      check_mode: false

    - name: Show them
      ansible.builtin.debug:
        msg: "{{ logs_out.results | map(attribute='stdout_lines') | list }}"
