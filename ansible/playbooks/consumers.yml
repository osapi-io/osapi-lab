---
# Removes the jobs consumers of agents that no longer run, and checks that each
# running agent has its consumers (osapi-io/osapi-lab#45).
#
# Each agent makes durable consumers on the jobs stream, and each name ends with
# `_<machine id>`. A deploy replaces VMs, and each new VM is a new machine ID,
# so the consumers of the old VMs stay. On 23 November 2026 the stream held
# 1000, the account limit; the new agents could not make theirs, and each job
# failed. osapi-io/osapi#1154 makes NATS remove an idle consumer by itself.
# This step is the lab's own guard, also for an older osapi build.
- name: Consumers
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    # lab_nats_url comes from the hub's address in the inventory.
    NATS_URL: "{{ hostvars[groups['hub'] | first].lab_nats_url }}"
    NATS_CREDS: "{{ lab_nats_creds_dir }}/cli.creds"
  vars:
    consumers_stream: osapi-JOBS
  tasks:
    - name: List the running agents
      ansible.builtin.command:
        argv: ["{{ lab_state }}/bin/osapi", -f, "{{ lab_state }}/config/cli.yaml", client, agent, list, --json]
      register: consumers_agents
      changed_when: false
      check_mode: false

    - name: List the consumers of the jobs stream
      ansible.builtin.command:
        argv: [nats, consumer, ls, "{{ consumers_stream }}", -n]
      register: consumers_list
      changed_when: false
      check_mode: false

    - name: Find the consumers of agents that no longer run
      ansible.builtin.set_fact:
        consumers_ids: "{{ (consumers_agents.stdout | from_json)['items'] | map(attribute='machine_id') | select | list }}"
        consumers_stale: >-
          {{ consumers_list.stdout_lines | map('trim') | select
             | select('search', '_[0-9a-f]{32}$')
             | reject('search', '_(' ~ ((consumers_agents.stdout | from_json)['items'] | map(attribute='machine_id') | select | join('|')) ~ ')$')
             | list }}

    - name: Remove the consumers of agents that no longer run
      ansible.builtin.command:
        argv: [nats, consumer, rm, "{{ consumers_stream }}", "{{ item }}", -f]
      loop: "{{ consumers_stale }}"
      # With no agent listed, each consumer would look stale. Remove none then.
      when: consumers_ids | length > 0
      changed_when: true

    - name: Check that each running agent has its consumers
      ansible.builtin.assert:
        that:
          - consumers_list.stdout_lines | select('search', '_' ~ item ~ '$') | list | length > 0
        fail_msg: >-
          The agent with machine ID {{ item }} has no consumer on {{ consumers_stream }}, so it
          gets no jobs. Look at its log for a consumer error, such as the stream's consumer limit.
        quiet: true
      loop: "{{ consumers_ids }}"

    - name: Say what changed
      ansible.builtin.debug:
        msg: "Removed {{ consumers_stale | length }} stale consumers; {{ consumers_ids | length }} agents have theirs."
