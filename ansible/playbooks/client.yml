---
# The configs on this machine: the client's, a remote agent's, and the SSH
# config that reaches each running VM through the hub. `just ssh` runs it.
- name: Find the running VMs
  hosts: hub
  gather_facts: true
  gather_subset: [min]
  environment:
    PATH: "{{ lab_hub_path }}"
  roles:
    - vm_inventory

- name: Client
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - client
