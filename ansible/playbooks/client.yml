---
# The configs on this machine: the client's, a remote agent's, and the SSH
# config that reaches each running VM through the hub. `just ssh` runs it.
- name: Find the running VMs
  hosts: hub
  gather_facts: true
  gather_subset: [min]
  environment:
    PATH: "{{ lab_hub_path }}"
  roles:
    - vm_inventory

# No connection: local here: it would also apply to the tasks that the client
# role delegates to the hub. The implicit localhost runs locally anyway.
- name: Client
  hosts: localhost
  gather_facts: false
  roles:
    - client
