---
# Builds the osapi checkout, bakes an image for each VM whose build or packer
# directory changed, and replaces those VMs with clones of their new images.
# A VM is its image: nothing is copied into a running VM. The exception is a VM
# with upgrade_in_place: true, which upgrade.yml upgrades as a host that runs
# for a long time. The hub's firewall step needs passwordless sudo.
- name: Lock
  ansible.builtin.import_playbook: lock.yml
- name: Build
  ansible.builtin.import_playbook: build.yml
# The secrets role checks the admin token against the signing keys on each run,
# and signs it again when a key changed or it expires soon.
- name: Secrets
  ansible.builtin.import_playbook: secrets.yml
- name: Hub
  ansible.builtin.import_playbook: hub.yml
- name: Images
  ansible.builtin.import_playbook: images.yml
  vars:
    lab_images_prune: true
- name: VMs
  ansible.builtin.import_playbook: vms.yml
- name: Upgrade
  ansible.builtin.import_playbook: upgrade.yml
- name: Ready
  ansible.builtin.import_playbook: ready.yml
- name: Client
  ansible.builtin.import_playbook: client.yml
- name: Consumers
  ansible.builtin.import_playbook: consumers.yml
- name: Unlock
  ansible.builtin.import_playbook: unlock.yml
