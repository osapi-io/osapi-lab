---
# The quick loop: build the osapi checkout and copy it into the hub and the
# running VMs, without touching the images. Seconds rather than minutes, but a
# VM then runs a build its image does not hold; push.yml brings them back in
# line. The hub's firewall step needs passwordless sudo.
- name: Build
  ansible.builtin.import_playbook: build.yml
- name: Hub
  ansible.builtin.import_playbook: hub.yml
- name: Agents
  ansible.builtin.import_playbook: agents.yml
- name: Client
  ansible.builtin.import_playbook: client.yml
