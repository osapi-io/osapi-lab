---
# Deploy the build in .lab/bin to every VM's agent. The VMs are found on the
# hub first, since they are not in the inventory file.
- name: Find the VMs
  hosts: hub
  gather_facts: true
  gather_subset: [min]
  environment:
    PATH: "{{ lab_hub_path }}"
  tasks:
    - name: Find each VM
      ansible.builtin.include_role:
        name: lab_vm
      vars:
        lab_vm_entry: "{{ item }}"
        lab_vm_tasks: discover
      loop: "{{ lab_vms }}"
      loop_control:
        label: "{{ item.name }}"

- name: Agents
  hosts: vms
  gather_facts: false
  roles:
    - agent
