---
# Puts a new osapi build on the lab in a few minutes, with no images: the hub
# gets its binary and restarts, and each running VM gets the linux build and
# restarts its agent, as upgrade.yml does for a VM that upgrades in place
# (osapi-io/osapi-lab#70). Each VM then runs a build that is not in its image,
# until the next deploy. Thus a bump is for a change to the osapi binary only:
# it refuses to run when the packer directory changed since the images were
# baked, because a change there, such as the agent's config, needs a deploy.
- name: Lock
  ansible.builtin.import_playbook: lock.yml
- name: Build
  ansible.builtin.import_playbook: build.yml

- name: Check that the images are current
  hosts: hub
  gather_facts: false
  tasks:
    - name: Fingerprint the packer directory
      delegate_to: localhost
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ lab_root }}/packer"
        find . -type f ! -path './.packer*' | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -c1-16
      args:
        executable: /bin/bash
      register: bump_packer_sum
      changed_when: false
      check_mode: false

    - name: Read the packer directory that the images are baked from
      ansible.builtin.command: cat {{ lab_hub_state_abs }}/images/packer.sum
      register: bump_baked_sum
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse a bump when the packer directory changed
      ansible.builtin.assert:
        that: bump_baked_sum.rc == 0 and bump_baked_sum.stdout == bump_packer_sum.stdout
        fail_msg: >-
          packer/ changed since the images were baked, or the hub has no record of
          it. A bump copies only the osapi binary. Run `just deploy`.
        quiet: true

- name: Hub
  ansible.builtin.import_playbook: hub.yml

# list.yml adds each running VM to the group vms. It changes nothing.
- name: Find the running VMs
  ansible.builtin.import_playbook: list.yml

- name: Read the agents before the bump
  hosts: hub
  gather_facts: false
  tasks:
    - name: List the agents
      ansible.builtin.command:
        argv:
          - "{{ lab_hub_state_abs }}/bin/osapi-darwin-arm64"
          - -f
          - "{{ lab_hub_state_abs }}/config/hub.yaml"
          - client
          - agent
          - list
          - --json
      register: bump_before
      changed_when: false
      failed_when: false
      check_mode: false

# copy writes a temporary file and renames it over the target, so the agent
# that runs keeps its own inode until the restart.
- name: Copy the build into each running VM
  hosts: vms
  gather_facts: false
  become: true
  tasks:
    - name: Copy the linux build
      ansible.builtin.copy:
        src: "{{ lab_state }}/bin/osapi-linux-arm64"
        dest: /usr/local/bin/osapi
        mode: "0755"
      register: bump_binary
      notify:
        - Record the build that the VM runs
        - Restart the agent
  handlers:
    - name: Record the build that the VM runs
      ansible.builtin.lineinfile:
        path: /etc/osapi-lab/image
        regexp: ^revision=
        line: revision={{ lab_build_revision }}

    - name: Restart the agent
      ansible.builtin.systemd_service:
        name: osapi-agent
        state: restarted

# The controller can report the old process as Ready for some seconds after
# the restart. Thus the wait is for a different started_at, as well as Ready.
- name: Wait for the bumped agents
  hosts: hub
  gather_facts: false
  tasks:
    - name: Wait for each bumped agent to start again and be Ready
      ansible.builtin.command:
        argv:
          - "{{ lab_hub_state_abs }}/bin/osapi-darwin-arm64"
          - -f
          - "{{ lab_hub_state_abs }}/config/hub.yaml"
          - client
          - agent
          - list
          - --json
      vars:
        bump_old: >-
          {{ ((bump_before.stdout | default('') or '{}') | from_json)['items'] | default([])
             | selectattr('hostname', 'equalto', item) | map(attribute='started_at') | list }}
        bump_new: >-
          {{ ((bump_after.stdout | default('') or '{}') | from_json)['items'] | default([])
             | selectattr('hostname', 'equalto', item) | selectattr('state', 'equalto', 'Ready')
             | map(attribute='started_at') | list }}
      loop: "{{ groups['vms'] | default([]) }}"
      when: hostvars[item].bump_binary is defined and hostvars[item].bump_binary is changed
      register: bump_after
      until: >-
        bump_after.rc == 0
        and bump_new | length > 0
        and bump_new | reject('in', bump_old) | list | length > 0
      retries: 36
      delay: 5
      changed_when: false
      check_mode: false

- name: Ready
  ansible.builtin.import_playbook: ready.yml
- name: Client
  ansible.builtin.import_playbook: client.yml
- name: Unlock
  ansible.builtin.import_playbook: unlock.yml
