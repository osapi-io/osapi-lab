---
# Remove the lab from the hub: the VMs, the NATS server and controller, the
# trace collector, the firewall entry and the hub's state directory. Safe to
# run again, and on a hub that never ran the lab.
#
# Kept unless asked: the images the VMs are cloned from, which take the
# longest to rebuild (-e lab_teardown_images=true), and this machine's .lab,
# which holds the lab's NATS operator and keys (-e lab_teardown_local=true).
# Removing the firewall entry needs passwordless sudo.
- name: Lock
  ansible.builtin.import_playbook: lock.yml
- name: Teardown the hub
  hosts: hub
  gather_facts: true
  gather_subset: [min]
  environment:
    PATH: "{{ lab_hub_path }}"
  vars:
    teardown_labels: >-
      {{ (lab_vms | map(attribute='name') | map('regex_replace', '^', 'io.osapi.lab.vm.') | list)
         + ['io.osapi.lab.controller', 'io.osapi.lab.nats', 'io.osapi.lab.jaeger'] }}
    teardown_firewall_apps:
      - "{{ lab_hub_state_abs }}/bin/osapi-darwin-arm64"
      - "{{ lab_hub_state_abs }}/bin/jaeger"
  tasks:
    # bootout first, so launchd does not start a VM or a process again while it
    # is being removed. The VMs go before NATS, so their agents stop first.
    - name: Stop each VM
      ansible.builtin.shell: |
        launchctl print "gui/$(id -u)/{{ item }}" >/dev/null 2>&1 || exit 0
        launchctl bootout "gui/$(id -u)/{{ item }}"
        echo stopped
      register: teardown_stopped
      changed_when: "'stopped' in teardown_stopped.stdout"
      loop: "{{ teardown_labels }}"

    - name: Remove the plist of each VM
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/{{ item }}.plist"
        state: absent
      loop: "{{ teardown_labels }}"

    - name: List the Tart VMs and images
      ansible.builtin.command: tart list --quiet
      register: teardown_tart
      changed_when: false
      check_mode: false

    - name: Delete each VM
      ansible.builtin.shell: |
        tart stop {{ item }} 2>/dev/null || true
        tart delete {{ item }}
      changed_when: true
      when: item in teardown_tart.stdout_lines
      loop: "{{ lab_vms | map(attribute='name') | map('regex_replace', '^', 'lab-') | list }}"

    - name: Delete each image
      ansible.builtin.command: tart delete {{ item }}
      changed_when: true
      when: lab_teardown_images | default(false) | bool
      loop: "{{ teardown_tart.stdout_lines | select('match', '^img-') | list }}"

    - name: Check the firewall entries for the osapi build and the trace collector
      ansible.builtin.command: /usr/libexec/ApplicationFirewall/socketfilterfw --getappblocked {{ item }}
      register: teardown_firewall
      changed_when: false
      check_mode: false
      failed_when: false
      loop: "{{ teardown_firewall_apps }}"

    - name: Remove the firewall entries for the osapi build and the trace collector
      when:
        - item.rc == 0
        - "'not part of' not in item.stdout"
      become: true
      ansible.builtin.command: /usr/libexec/ApplicationFirewall/socketfilterfw --remove {{ item.item }}
      changed_when: true
      loop: "{{ teardown_firewall.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Remove the hub's state directory
      ansible.builtin.file:
        path: "{{ lab_hub_state_abs }}"
        state: absent

- name: Teardown this machine
  hosts: localhost
  gather_facts: false
  tasks:
    # The remote agent's join and its NATS user belong to the hub's operator,
    # which the teardown removed; nsc made the NATS auth before osapi did.
    - name: Remove the remote agent's join, and what nsc made
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ lab_state }}/remote-agent"
        - "{{ lab_state }}/config/agent-remote.yaml"
        - "{{ lab_secrets_dir }}/nsc"
        - "{{ lab_secrets_dir }}/resolver.conf"

    - name: Remove .lab
      when: lab_teardown_local | default(false) | bool
      ansible.builtin.file:
        path: "{{ lab_state }}"
        state: absent
