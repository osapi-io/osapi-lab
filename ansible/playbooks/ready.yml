---
# Waits until the agent of each VM is Ready on the hub. A VM is its image, so
# nothing logs in to it: the agent starts at boot with the config baked in, the
# hub admits it, and the controller reports it.
- name: "Ready: wait for each agent, which starts at boot from its baked config"
  hosts: hub
  gather_facts: true
  gather_subset: [min]
  environment:
    PATH: "{{ lab_hub_path }}"
  tasks:
    - name: Wait for each agent to be Ready
      ansible.builtin.command:
        argv:
          - "{{ lab_hub_state_abs }}/bin/osapi-darwin-arm64"
          - -f
          - "{{ lab_hub_state_abs }}/config/hub.yaml"
          - client
          - agent
          - list
          - --json
      register: ready_agents
      changed_when: false
      check_mode: false
      vars:
        ready_names: >-
          {{ ((ready_agents.stdout | default('{}') | from_json)['items'] | default([]))
             | selectattr('state', 'equalto', 'Ready') | map(attribute='hostname') | list }}
      until: >-
        ready_agents.rc == 0
        and (lab_vms | map(attribute='name') | reject('in', ready_names) | list | length) == 0
      retries: 36
      delay: 5
