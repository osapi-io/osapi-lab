---
# Clone and run every VM in group_vars/all.yml, each under its own launchd
# agent, and add them to the inventory. A VM cloned from an older image is
# recloned; -e lab_vms_recreate=true reclones every one.
- name: Lock
  ansible.builtin.import_playbook: lock.yml
- name: VMs
  hosts: hub
  gather_facts: true
  gather_subset: [min]
  environment:
    PATH: "{{ lab_hub_path }}"
  tasks:
    - name: Run each VM
      ansible.builtin.include_role:
        name: lab_vm
      vars:
        lab_vm_entry: "{{ item }}"
        lab_vm_recreate: "{{ lab_vms_recreate | default(false) }}"
      loop: "{{ lab_vms }}"
      loop_control:
        label: "{{ item.name }}"
- name: Unlock
  ansible.builtin.import_playbook: unlock.yml
