---
# Bakes one image for each VM of the inventory: the whole VM, with its osapi
# build, config, NATS credential, hostname and packages. packer/lab.pkr.hcl
# does the baking with Packer's own provisioners; this playbook makes what must
# exist outside the image (each VM's NATS user), and runs one build per VM.
#
# An image is built again when it is missing, or when what it was baked from
# changed: the osapi build, or the packer directory. lab_images_rebuild=true
# builds each one again. A VM that upgrades in place gets an image only when
# the VM does not exist yet.
- name: Lock
  ansible.builtin.import_playbook: lock.yml
- name: Images
  hosts: hub
  gather_facts: true
  gather_subset: [min]
  environment:
    PATH: "{{ lab_hub_path }}"
  pre_tasks:
    - name: Check there is a build to bake
      ansible.builtin.assert:
        that: lab_build_tag | length > 0
        fail_msg: No tagged build in .lab/bin. Run playbooks/build.yml first.
        quiet: true
    - name: Fingerprint the packer directory
      delegate_to: localhost
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ lab_root }}/packer"
        find . -type f ! -path './.packer*' | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -c1-16
      args:
        executable: /bin/bash
      register: images_packer_sum
      changed_when: false
      check_mode: false
    # A distribution with no Tart image to pull has a directory under
    # packer/bases. Its local image is named for what the directory holds, so
    # a change to the source or the seed makes a new one.
    - name: Fingerprint each base under packer/bases
      delegate_to: localhost
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ lab_root }}/packer/bases"
        for dir in */; do
          dir=${dir%/}
          sum=$(find "$dir" -type f | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -c1-16)
          echo "$dir base-$dir-$sum"
        done
      args:
        executable: /bin/bash
      register: images_bases_sum
      changed_when: false
      check_mode: false
    - name: Name the local base of each distribution that has one
      ansible.builtin.set_fact:
        lab_bases: "{{ dict(images_bases_sum.stdout_lines | map('split', ' ') | list) }}"
    - name: Name what each image is baked from
      ansible.builtin.set_fact:
        lab_image_fingerprint: "{{ lab_build_fingerprint }}-{{ images_packer_sum.stdout }}"
    - name: List the images on the hub
      ansible.builtin.command: tart list --quiet --source local
      register: images_present
      changed_when: false
      check_mode: false
    - name: Read the fingerprint each image was baked from
      ansible.builtin.command: cat {{ lab_hub_state_abs }}/images/img-{{ item.name }}-{{ lab_build_tag }}.fingerprint
      loop: "{{ lab_vms }}"
      loop_control:
        label: "{{ item.name }}"
      register: images_baked
      changed_when: false
      failed_when: false
      check_mode: false
    # A VM that upgrades in place clones its image one time. While the VM
    # exists, it needs no new image: the upgrade playbook copies each build
    # into it. lab_images_rebuild=true bakes it again, for `just rebuild`.
    - name: Choose the images to build
      vars:
        images_kept: >-
          {{ lab_vms | selectattr('upgrade_in_place', 'defined') | selectattr('upgrade_in_place')
             | selectattr('name', 'in', images_present.stdout_lines | select('match', '^lab-')
                                        | map('regex_replace', '^lab-', '') | list)
             | list }}
        images_stale: >-
          {{ images_baked.results | rejectattr('stdout', 'equalto', lab_image_fingerprint)
             | map(attribute='item') | list }}
        images_missing: >-
          {{ lab_vms | rejectattr('name', 'in', images_present.stdout_lines
                                                | map('regex_replace', '^img-', '')
                                                | map('regex_replace', '-' ~ lab_build_tag ~ '$', '') | list) | list }}
      ansible.builtin.set_fact:
        images_wanted: >-
          {{ lab_vms if (lab_images_rebuild | default(false) | bool)
             else (images_stale + images_missing) | unique | reject('in', images_kept) | list }}
  tasks:
    - name: Create the image records directory
      ansible.builtin.file:
        path: "{{ lab_hub_state_abs }}/images"
        state: directory
        mode: "0700"
    - name: Copy the linux build to the hub
      when: images_wanted | length > 0
      ansible.builtin.copy:
        src: "{{ lab_state }}/bin/osapi-linux-arm64"
        dest: "{{ lab_hub_state_abs }}/bin/osapi-linux-arm64"
        mode: "0755"
    - name: Make the NATS user of each VM
      ansible.builtin.include_role:
        name: secrets
        tasks_from: user
      vars:
        secrets_nats_user: "agent-{{ item.name }}"
      loop: "{{ images_wanted }}"
      loop_control:
        label: "{{ item.name }}"
    - name: Delete the images being rebuilt
      ansible.builtin.command: tart delete img-{{ item.name }}-{{ lab_build_tag }}
      loop: "{{ images_wanted }}"
      loop_control:
        label: "{{ item.name }}"
      when: ('img-' ~ item.name ~ '-' ~ lab_build_tag) in images_present.stdout_lines
      changed_when: true
    - name: Make the local base of each distribution that has one
      ansible.builtin.include_role:
        name: tart_base
      vars:
        tart_base_name: "{{ lab_bases[images_base] }}"
        tart_base_prefix: base-{{ images_base }}-
        tart_base_source_dir: "{{ lab_root }}/packer/bases/{{ images_base }}"
        tart_base_work_dir: "{{ lab_hub_state_abs }}/bases/{{ images_base }}"
      loop: "{{ images_wanted | map(attribute='image') | unique | select('in', lab_bases) | list }}"
      # The role loops too; its loop must not reuse this loop's variable,
      # because these vars are evaluated lazily inside it.
      loop_control:
        loop_var: images_base
    - name: Build the image of each VM
      ansible.builtin.include_role:
        name: packer
      vars:
        packer_template_dir: "{{ lab_root }}/packer"
        packer_dest: "{{ lab_hub_state_abs }}/packer"
        packer_vars:
          vm: "{{ item.name }}"
          distro: "{{ item.image }}"
          base_image: "{{ lab_bases[item.image] | default('') }}"
          image_tag: "{{ lab_build_tag }}"
          revision: "{{ lab_build_revision }}"
          osapi_binary: "{{ lab_hub_state_abs }}/bin/osapi-linux-arm64"
          ssh_pubkey: "{{ lookup('ansible.builtin.file', lab_ssh_key ~ '.pub') }}"
          nats_port: "{{ lab_nats_port }}"
          tracing_port: "{{ lab_tracing_otlp_port }}"
        # The credential goes in the environment, so it is in no argument
        # list on the hub and no log of this run.
        packer_env:
          PKR_VAR_nats_creds: "{{ lookup('ansible.builtin.file', lab_nats_creds_dir ~ '/agent-' ~ item.name ~ '.creds') }}"
      loop: "{{ images_wanted }}"
      loop_control:
        label: "{{ item.name }}"
    - name: Record the fingerprint each image was baked from
      ansible.builtin.copy:
        dest: "{{ lab_hub_state_abs }}/images/img-{{ item.name }}-{{ lab_build_tag }}.fingerprint"
        content: "{{ lab_image_fingerprint }}"
        mode: "0644"
      loop: "{{ images_wanted }}"
      loop_control:
        label: "{{ item.name }}"
    # An image that a build recorded in the last hour stays, also when this
    # build does not clone it: it can be the image of a run that broke the
    # lock, or that a VM is cloned from now (osapi-io/osapi-lab#38).
    - name: Find the images that no VM of this build clones, and no build recorded in the last hour
      when: lab_images_prune | default(false) | bool
      ansible.builtin.shell: |
        set -u
        for image in {{ images_prunable | join(' ') }}; do
          record="{{ lab_hub_state_abs }}/images/$image.fingerprint"
          if [ -f "$record" ] && [ -n "$(find "$record" -mmin -60)" ]; then
            continue
          fi
          echo "$image"
        done
      vars:
        images_prunable: >-
          {{ images_present.stdout_lines | select('match', '^img-')
             | reject('in', lab_vms | map(attribute='name')
                            | map('regex_replace', '^(.*)$', 'img-\\1-' ~ lab_build_tag) | list) | list }}
      register: images_old
      changed_when: false
      check_mode: false
    - name: Delete the images that no VM of this build clones
      when: lab_images_prune | default(false) | bool
      ansible.builtin.command: tart delete {{ item }}
      loop: "{{ images_old.stdout_lines | default([]) }}"
      changed_when: true
- name: Unlock
  ansible.builtin.import_playbook: unlock.yml
