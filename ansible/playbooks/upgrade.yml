---
# Upgrades each VM that has upgrade_in_place: true, as an operator upgrades a
# host that runs for a long time (osapi-io/osapi-lab#49). It copies the new
# linux build to /usr/local/bin/osapi, restarts osapi-agent, and waits until
# the controller reports a new agent process that is Ready. The run fails if
# the agent does not come back. The VM keeps its machine ID, the agent's KV
# records, its consumers and its job history.
#
# This is the one place where the lab changes a running VM. Each other VM is its
# image. vms.yml adds the VMs that upgrade in place to the vms_in_place group.
- name: Read the agents before the upgrade
  hosts: hub
  gather_facts: true
  gather_subset: [min]
  tasks:
    - name: List the agents
      when: groups['vms_in_place'] | default([]) | length > 0
      ansible.builtin.command:
        argv:
          - "{{ lab_hub_state_abs }}/bin/osapi-darwin-arm64"
          - -f
          - "{{ lab_hub_state_abs }}/config/hub.yaml"
          - client
          - agent
          - list
          - --json
      register: upgrade_before
      changed_when: false
      failed_when: false
      check_mode: false

- name: Upgrade in place
  hosts: vms_in_place
  gather_facts: false
  become: true
  tasks:
    # osapi-io/osapi#1249 changed controller.api.security.signing_key to the
    # list signing_keys, and osapi does not load a config without the list. A VM
    # that upgrades in place keeps the config of its image. Thus the upgrade
    # changes the key to a list in the config, and removes a signing_key that is
    # left, which osapi ignores.
    - name: Read the config of the agent
      ansible.builtin.slurp:
        src: /etc/osapi/osapi.yaml
      register: upgrade_config
      no_log: true

    - name: Change the signing key of the config to a list
      when: "'signing_keys:' not in (upgrade_config.content | b64decode)"
      ansible.builtin.replace:
        path: /etc/osapi/osapi.yaml
        regexp: '^(\s+)signing_key: (\S+)$'
        replace: '\1signing_keys:\n\1  - id: unused\n\1    key: \2'
      no_log: true
      notify: Restart the agent

    - name: Remove the old signing key from the config
      ansible.builtin.replace:
        path: /etc/osapi/osapi.yaml
        regexp: '^\s+signing_key: \S+\n'
        replace: ""
      no_log: true
      notify: Restart the agent

    # The image of a VM that upgrades in place is from before the agent allowed
    # command exec. The integration suite runs its command examples on each VM.
    - name: Read the config of the agent again
      ansible.builtin.slurp:
        src: /etc/osapi/osapi.yaml
      register: upgrade_config_command
      no_log: true

    - name: Allow command exec in the config of the agent
      when: "'\n  command:\n    enabled: true' not in (upgrade_config_command.content | b64decode)"
      ansible.builtin.blockinfile:
        path: /etc/osapi/osapi.yaml
        insertafter: '^agent:$'
        marker: "  # {mark} osapi-lab: command exec"
        block: |2
            command:
              enabled: true
      notify: Restart the agent

    # The hub serves NATS and OTLP over TLS (osapi-io/osapi#1385, #1396). The
    # image of a VM that upgrades in place connects in plain text, so the
    # upgrade gives its NATS connection and its exporter a tls block. The VM
    # dials the hub by its address on tart's network; the hub's certificate
    # names its Tailscale name.
    - name: Connect to NATS with TLS
      ansible.builtin.blockinfile:
        path: /etc/osapi/osapi.yaml
        insertafter: '^      creds_file: '
        marker: "    # {mark} osapi-lab: nats tls"
        block: |2
              tls:
                enabled: true
                server_name: {{ lab_hub_addr }}
      notify: Restart the agent

    - name: Send traces with TLS
      ansible.builtin.blockinfile:
        path: /etc/osapi/osapi.yaml
        insertafter: '^    otlp_endpoint: '
        marker: "    # {mark} osapi-lab: tracing tls"
        block: |2
              tls:
                enabled: true
                server_name: {{ lab_hub_addr }}
      notify: Restart the agent

    # copy writes a temporary file and renames it over the target, so the agent
    # that runs keeps its own inode until the restart.
    # The image of a VM that upgrades in place can have unattended-upgrades,
    # which holds the dpkg lock after boot.
    - name: Read the family of the OS
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Remove unattended-upgrades
      when: ansible_facts.os_family == 'Debian'
      ansible.builtin.apt:
        name: unattended-upgrades
        state: absent
        purge: true

    - name: Copy the linux build
      ansible.builtin.copy:
        src: "{{ lab_state }}/bin/osapi-linux-arm64"
        dest: /usr/local/bin/osapi
        mode: "0755"
      register: upgrade_binary
      notify:
        - Record the build that the VM runs
        - Restart the agent

  # The handlers run at the end of this play, before the wait below.
  handlers:
    # /etc/osapi-lab/image keeps the image that the VM was cloned from; the
    # revision is now the build that it runs, which list.yml shows.
    - name: Record the build that the VM runs
      ansible.builtin.lineinfile:
        path: /etc/osapi-lab/image
        regexp: ^revision=
        line: revision={{ lab_build_revision }}

    - name: Restart the agent
      ansible.builtin.systemd_service:
        name: osapi-agent
        state: restarted

- name: Wait for the upgraded agents
  hosts: hub
  gather_facts: true
  gather_subset: [min]
  tasks:
    # The controller can report the old process as Ready for some seconds after
    # the restart. Thus the wait is for a different started_at, as well as for
    # Ready.
    - name: Wait for each upgraded agent to start again and be Ready
      ansible.builtin.command:
        argv:
          - "{{ lab_hub_state_abs }}/bin/osapi-darwin-arm64"
          - -f
          - "{{ lab_hub_state_abs }}/config/hub.yaml"
          - client
          - agent
          - list
          - --json
      vars:
        upgrade_old: >-
          {{ ((upgrade_before.stdout | default('') or '{}') | from_json)['items'] | default([])
             | selectattr('hostname', 'equalto', item) | map(attribute='started_at') | list }}
        upgrade_new: >-
          {{ ((upgrade_after.stdout | default('') or '{}') | from_json)['items'] | default([])
             | selectattr('hostname', 'equalto', item) | selectattr('state', 'equalto', 'Ready')
             | map(attribute='started_at') | list }}
      loop: "{{ groups['vms_in_place'] | default([]) }}"
      when: hostvars[item].upgrade_binary is defined and hostvars[item].upgrade_binary is changed
      register: upgrade_after
      until: >-
        upgrade_after.rc == 0
        and upgrade_new | length > 0
        and upgrade_new | reject('in', upgrade_old) | list | length > 0
      retries: 36
      delay: 5
      changed_when: false
      check_mode: false
