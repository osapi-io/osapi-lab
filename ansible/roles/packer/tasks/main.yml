---
# Runs one packer build of the template in packer_template_dir, on the host,
# with packer_vars as -var arguments and packer_env in the environment. A
# value that is a secret goes in packer_env as PKR_VAR_<name>, so it is in no
# argument list. The template marks each such variable sensitive, so Packer
# prints none of them, and a failed build shows its output.
- name: Check the packer arguments
  ansible.builtin.assert:
    that:
      - packer_template_dir | length > 0
      - packer_dest | length > 0
    quiet: true

# A copy adds and replaces files, but removes none: a file that the template
# no longer has would stay in the build.
- name: Remove the earlier copy of the template
  ansible.builtin.file:
    path: "{{ packer_dest }}"
    state: absent
  changed_when: false

- name: Copy the template to {{ packer_dest }}
  ansible.builtin.copy:
    src: "{{ packer_template_dir }}/"
    dest: "{{ packer_dest }}/"
    mode: preserve

- name: Install the template's plugins
  ansible.builtin.command:
    cmd: mise exec packer@{{ packer_version }} -- packer init .
    chdir: "{{ packer_dest }}"
  register: packer_init
  changed_when: "'Installed plugin' in packer_init.stdout"

- name: Build {{ packer_vars.vm | default('the template') }}
  ansible.builtin.command:
    chdir: "{{ packer_dest }}"
    argv: >-
      {{ ['mise', 'exec', 'packer@' ~ packer_version, '--', 'packer', 'build']
         + (['-force'] if packer_force else [])
         + (packer_vars | dict2items | map(attribute='key') | zip(packer_vars | dict2items | map(attribute='value'))
            | map('join', '=') | map('regex_replace', '^', '-var=') | list)
         + ['.'] }}
  environment: "{{ packer_env }}"
  changed_when: true
