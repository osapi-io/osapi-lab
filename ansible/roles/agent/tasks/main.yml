---
- name: Render the config for {{ agent_node }}
  delegate_to: localhost
  ansible.builtin.template:
    src: agent.yaml.j2
    dest: "{{ lab_state }}/config/{{ agent_node }}.yaml"
    mode: "0600"

# Checked with the same build before it ships, so a config the agent would
# reject stops here rather than crash-looping in the VM. osapi validates the
# config before every command; liveness is one every release has. Failing to
# reach the controller is fine here; `invalid config` is not.
- name: Check with the build the config for {{ agent_node }}
  delegate_to: localhost
  ansible.builtin.command:
    argv:
      - "{{ lab_state }}/bin/osapi-darwin-arm64"
      - -f
      - "{{ lab_state }}/config/{{ agent_node }}.yaml"
      - client
      - health
      - liveness
  register: agent_check
  changed_when: false
  check_mode: false
  failed_when: "'invalid config' in (agent_check.stdout ~ agent_check.stderr)"

- name: Set the hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ agent_node }}"

- name: Install the linux build
  become: true
  ansible.builtin.copy:
    src: "{{ lab_state }}/bin/osapi-linux-arm64"
    dest: /usr/local/bin/osapi
    mode: "0755"
  register: agent_binary

- name: Install the config
  become: true
  ansible.builtin.copy:
    src: "{{ lab_state }}/config/{{ agent_node }}.yaml"
    dest: /etc/osapi/osapi.yaml
    mode: "0600"
  register: agent_config

- name: Make {{ agent_node }}'s NATS user
  ansible.builtin.include_role:
    name: secrets
    tasks_from: user
  vars:
    nats_user: "agent-{{ agent_node }}"

- name: Install {{ agent_node }}'s NATS credentials
  become: true
  ansible.builtin.copy:
    src: "{{ lab_nats_creds_dir }}/agent-{{ agent_node }}.creds"
    dest: /etc/osapi/nats.creds
    mode: "0600"
  register: agent_creds

# osapi's agent exits at startup on a distribution outside its supported list.
# IGNORE_LINUX is osapi's own override: the agent starts, uses the generic Linux
# providers, and skips what has none. Only nodes that are not Debian family get
# it, so the gate still runs everywhere it passes.
- name: Create the drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/osapi-agent.service.d
    state: directory
    mode: "0755"
  when: agent_distro not in lab_debian_family

- name: Set IGNORE_LINUX on a distribution osapi does not support
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/osapi-agent.service.d/lab.conf
    content: |
      [Service]
      Environment=IGNORE_LINUX=1
    mode: "0644"
  when: agent_distro not in lab_debian_family
  register: agent_dropin_set

- name: Remove IGNORE_LINUX where osapi supports the distribution
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/osapi-agent.service.d/lab.conf
    state: absent
  when: agent_distro in lab_debian_family
  register: agent_dropin_unset

- name: Restart osapi-agent
  become: true
  ansible.builtin.systemd_service:
    name: osapi-agent
    state: restarted
    enabled: true
    daemon_reload: "{{ agent_dropin_set is changed or agent_dropin_unset is changed }}"
  when: >-
    agent_binary is changed or agent_config is changed or agent_creds is changed
    or agent_dropin_set is changed or agent_dropin_unset is changed
    or (agent_restart | bool)

- name: Wait for osapi-agent to stay up
  become: true
  ansible.builtin.systemd_service:
    name: osapi-agent
  register: agent_active
  retries: 10
  delay: 2
  until: agent_active.status.ActiveState == 'active'
