---
# The image of a VM is the whole VM. Its record holds what it was baked from,
# so a VM is cloned again when its image was rebuilt.
- name: Read what the image was baked from {{ lab_vm_entry.name }}
  ansible.builtin.command: cat {{ lab_hub_state_abs }}/images/img-{{ lab_vm_entry.name }}-{{ lab_build_tag }}.fingerprint
  register: lab_vm_image_fingerprint
  changed_when: false
  failed_when: false
  check_mode: false

- name: Name what the VM should be cloned from
  ansible.builtin.set_fact:
    lab_vm_wanted: "img-{{ lab_vm_entry.name }}-{{ lab_build_tag }} {{ lab_vm_image_fingerprint.stdout | default('') }}"

- name: Check there is a tagged image to clone
  when: lab_vm_tasks == 'main'
  ansible.builtin.assert:
    that: lab_build_tag | length > 0
    fail_msg: No tagged build in .lab/bin to clone from. Run `just build images` first.
    quiet: true

# What the VM should be cloned from: the image and the source fingerprint. The
# hub records what it was cloned from; a VM that differs is recloned.
- name: Read what the VM was cloned from {{ lab_vm_entry.name }}
  when: lab_vm_tasks == 'main'
  ansible.builtin.command: cat {{ lab_hub_state_abs }}/vms/{{ lab_vm_entry.name }}.source
  register: lab_vm_source
  changed_when: false
  failed_when: false
  check_mode: false

# The VM's launchd agent logs here, so it exists before the agent does.
- name: Create the hub's log directory
  when: lab_vm_tasks == 'main'
  ansible.builtin.file:
    path: "{{ lab_hub_state_abs }}/log"
    state: directory
    mode: "0700"

- name: Decide whether to clone again {{ lab_vm_entry.name }}
  ansible.builtin.set_fact:
    lab_vm_reclone: >-
      {{ (lab_vm_recreate | bool)
         or (lab_vm_tasks == 'main' and (lab_vm_source.stdout | default('')) != lab_vm_wanted) }}

# A VM that is cloned again has a new machine ID, and asks to join as a new
# machine. The old machine stays admitted, with its key, unless it is deleted
# first: admission delete removes the key and each record, and keeps none,
# so nothing marks the rebuild as a revocation. The hub may not run yet, on the
# first deploy; then there is nothing to delete, and the list fails quietly.
- name: Delete the admission of the VM before it is cloned again
  when: lab_vm_reclone | bool
  block:
    - name: List the admission records of {{ lab_vm_entry.name }}
      ansible.builtin.command:
        argv:
          - "{{ lab_hub_state_abs }}/bin/osapi-darwin-arm64"
          - -f
          - "{{ lab_hub_state_abs }}/config/hub.yaml"
          - client
          - admission
          - list
          - --json
      register: lab_vm_admission
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Delete each machine of {{ lab_vm_entry.name }}
      when: lab_vm_admission.rc == 0
      ansible.builtin.command:
        argv:
          - "{{ lab_hub_state_abs }}/bin/osapi-darwin-arm64"
          - -f
          - "{{ lab_hub_state_abs }}/config/hub.yaml"
          - client
          - admission
          - delete
          - --machine-id
          - "{{ item.machine_id }}"
      loop: >-
        {{ ((lab_vm_admission.stdout | from_json)['items'] | default([]))
           | selectattr('hostname', 'equalto', lab_vm_entry.name) | list }}
      loop_control:
        label: "{{ item.machine_id }}"
      changed_when: true

- name: Run tart_vm for {{ lab_vm_entry.name }}
  ansible.builtin.include_role:
    name: tart_vm
    tasks_from: "{{ lab_vm_tasks }}"
  vars:
    tart_vm_name: "lab-{{ lab_vm_entry.name }}"
    tart_vm_source: "img-{{ lab_vm_entry.name }}-{{ lab_build_tag }}"
    tart_vm_recreate: "{{ lab_vm_reclone }}"
    tart_vm_launchd_label: "io.osapi.lab.vm.{{ lab_vm_entry.name }}"
    tart_vm_log: "{{ lab_hub_state_abs }}/log/vm-{{ lab_vm_entry.name }}.log"
    tart_vm_inventory_name: "{{ lab_vm_entry.name }}"
    tart_vm_groups: [vms]
    tart_vm_user: "{{ lab_vm_user }}"
    tart_vm_ssh_key: "{{ lab_ssh_key }}"
    # The VMs are on the hub's vmnet subnet, reachable only through the hub.
    tart_vm_ssh_args: >-
      -o ProxyJump={{ (ansible_user ~ '@') if ansible_user is defined else '' }}{{ ansible_host }}
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

- name: Record what the VM was cloned from {{ lab_vm_entry.name }}
  when: lab_vm_tasks == 'main'
  block:
    - name: Create the VM records directory
      ansible.builtin.file:
        path: "{{ lab_hub_state_abs }}/vms"
        state: directory
        mode: "0700"

    - name: Write the record {{ lab_vm_entry.name }}
      ansible.builtin.copy:
        dest: "{{ lab_hub_state_abs }}/vms/{{ lab_vm_entry.name }}.source"
        content: "{{ lab_vm_wanted }}"
        mode: "0644"
