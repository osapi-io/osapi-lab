---
# Compiles the osapi checkout at lab_osapi_dir, on the machine running Ansible,
# for each OS of build_os: darwin for this machine and the hub, linux for the
# VMs, uncommitted changes included. It refuses a checkout that is detached or
# behind origin/main, unless -e build_allow_stale=true.
#
# An OS is skipped when the checkout has not changed since it was built: the
# commit, the uncommitted diff and the untracked files are fingerprinted, and
# each OS keeps the fingerprint of its build in <os>.FINGERPRINT beside the
# binaries. -e build_force=true builds anyway.

- name: Resolve the checkout
  ansible.builtin.set_fact:
    build_dir: "{{ lab_osapi_dir | expanduser }}"
    build_bin: "{{ lab_state }}/bin"

- name: Create the bin directory
  ansible.builtin.file:
    path: "{{ build_bin }}"
    state: directory
    mode: "0755"

# REVISION is for people: branch@commit, and whether the tree was dirty. TAG
# names the images built from it: the short commit, with -dirty when the tree
# had uncommitted changes. FINGERPRINT changes with any change to the source:
# the same dirty tree gives the same one, and any edit a new one.
- name: Describe the checkout
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      sha="$(git rev-parse --short HEAD)"
      rev="$(git rev-parse --abbrev-ref HEAD)@$sha"
      tag="$sha"
      if [ -n "$(git status --porcelain)" ]; then
        rev="$rev with uncommitted changes"
        tag="$sha-dirty"
      fi
      echo "$rev"
      echo "$tag"
      {
        git rev-parse HEAD
        git diff HEAD --binary
        git ls-files --others --exclude-standard -z | xargs -0 shasum 2>/dev/null
      } | shasum | cut -d' ' -f1
    chdir: "{{ build_dir }}"
  register: build_rev
  changed_when: false
  check_mode: false

# A detached HEAD or a branch behind origin/main is an old build: on 26
# November 2026 a NATS from before the AES store could not open the hub's
# store, and the agents dropped. A branch ahead of origin/main, and
# uncommitted changes, are a change under test, and pass.
- name: Compare the checkout with origin/main
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      # A fetch that fails, such as offline, compares with the origin/main
      # that the last fetch left: the run says so, and goes on.
      if git fetch -q origin main 2>/dev/null; then fetched=fetched; else fetched=unfetched; fi
      if ! git rev-parse -q --verify origin/main > /dev/null; then
        echo "{{ build_dir }} has no origin/main to compare with: add the osapi remote as origin, or -e build_allow_stale=true" >&2
        exit 1
      fi
      if git symbolic-ref -q HEAD > /dev/null; then echo branch; else echo detached; fi
      git rev-list --count HEAD..origin/main
      git rev-parse --short origin/main
      echo "$fetched"
    chdir: "{{ build_dir }}"
  register: build_base
  changed_when: false
  failed_when: build_base.rc != 0 and not (build_allow_stale | bool)
  check_mode: false

- name: Say that origin/main could not be fetched
  when: build_base.rc == 0 and build_base.stdout_lines[3] == 'unfetched'
  ansible.builtin.debug:
    msg: >-
      git fetch origin main failed in {{ build_dir }}: the check compares with
      origin/main as the last fetch left it ({{ build_base.stdout_lines[2] }}).

- name: Refuse an old checkout
  ansible.builtin.assert:
    that: >-
      (build_allow_stale | bool) or
      (build_base.rc == 0 and build_base.stdout_lines[0] == 'branch' and build_base.stdout_lines[1] == '0')
    fail_msg: >-
      {{ build_dir }} is at {{ build_rev.stdout_lines[0] }}, which is
      {{ 'a detached HEAD and ' if build_base.stdout_lines[0] == 'detached' else '' }}{{ build_base.stdout_lines[1] }}
      commits behind origin/main ({{ build_base.stdout_lines[2] }}). Put it on main and pull, or
      rebase the branch onto origin/main. -e build_allow_stale=true builds it anyway.
    quiet: true

- name: Check for the binaries
  ansible.builtin.stat:
    path: "{{ build_bin }}/osapi-{{ item }}-arm64"
  loop: "{{ build_os }}"
  register: build_binaries

# An OS is built when its binary is missing, or when the source changed since
# it was built: each OS keeps the fingerprint of the source it was built from.
- name: Choose the OSes to build
  ansible.builtin.set_fact:
    build_needed: >-
      {%- set out = [] -%}
      {%- for r in build_binaries.results -%}
        {%- set built = lookup('ansible.builtin.file', build_bin ~ '/' ~ r.item ~ '.FINGERPRINT', errors='ignore') | default('', true) -%}
        {%- if (build_force | bool) or not r.stat.exists or built != build_rev.stdout_lines[2] -%}
          {%- set _ = out.append(r.item) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Build the UI
  when: build_needed | length > 0
  ansible.builtin.shell:
    cmd: |
      mise trust -q .
      mise exec -- just fetch > /dev/null
      mise exec -- just react-deps react-build > /dev/null
    chdir: "{{ build_dir }}"
  changed_when: true

# go build writes beside the target and renames it, so a binary that runs from
# .lab/bin keeps its own inode.
- name: Compile osapi
  ansible.builtin.shell:
    cmd: |
      mise exec -- go build -o "{{ build_bin }}/osapi-{{ item }}-arm64.new" .
      mv -f "{{ build_bin }}/osapi-{{ item }}-arm64.new" "{{ build_bin }}/osapi-{{ item }}-arm64"
    chdir: "{{ build_dir }}"
  environment:
    CGO_ENABLED: "0"
    GOOS: "{{ item }}"
    GOARCH: arm64
  loop: "{{ build_needed }}"
  changed_when: true

- name: Record what was built for each OS
  ansible.builtin.copy:
    dest: "{{ build_bin }}/{{ item.0 }}.{{ item.1.file }}"
    content: "{{ item.1.value }}\n"
    mode: "0644"
  loop: "{{ build_needed | product(build_records) | list }}"
  loop_control:
    label: "{{ item.0 }}.{{ item.1.file }}"
  vars:
    build_records:
      - { file: REVISION, value: "{{ build_rev.stdout_lines[0] }}" }
      - { file: TAG, value: "{{ build_rev.stdout_lines[1] }}" }
      - { file: FINGERPRINT, value: "{{ build_rev.stdout_lines[2] }}" }

- name: Link osapi to the darwin build
  ansible.builtin.file:
    src: osapi-darwin-arm64
    dest: "{{ build_bin }}/osapi"
    state: link
    force: true

- name: Say what was built
  ansible.builtin.debug:
    msg: >-
      {{ ('built ' ~ (build_needed | join(' and '))) if build_needed else 'already built' }}:
      {{ build_rev.stdout_lines[0] }}, images tagged {{ build_rev.stdout_lines[1] }}
