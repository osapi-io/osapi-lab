---
# A NATS user in osapi's account, and its credentials file: a JWT the account
# signed and the user's seed. Made once, on the machine running Ansible, and
# only the credentials file is copied anywhere. Include with secrets_nats_user set.

- name: Create the NATS user {{ secrets_nats_user }}
  delegate_to: localhost
  # nsc writes one store; two users made at once would race on it.
  throttle: 1
  ansible.builtin.shell: |
    set -eu
    n() { mise exec -C "{{ lab_root }}" -- nsc --data-dir "{{ lab_nsc_dir }}/stores" "$@"; }
    n describe user --account "{{ lab_nats_account }}" --name "{{ secrets_nats_user }}" > /dev/null 2>&1 \
      || n add user --account "{{ lab_nats_account }}" --name "{{ secrets_nats_user }}"
    n generate creds --account "{{ lab_nats_account }}" --name "{{ secrets_nats_user }}" \
      --output-file "{{ lab_nats_creds_dir }}/{{ secrets_nats_user }}.creds"
    chmod 0600 "{{ lab_nats_creds_dir }}/{{ secrets_nats_user }}.creds"
  args:
    creates: "{{ lab_nats_creds_dir }}/{{ secrets_nats_user }}.creds"
  environment: "{{ lab_nsc_env }}"
