---
# The lab's secrets and the VMs' SSH key, generated once into .lab/ on the
# machine running Ansible. A secret that exists is kept. Nothing leaves this
# machine except inside a rendered config.

- name: Create the secret and key directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ lab_state }}"
    - "{{ lab_secrets_dir }}"
    - "{{ lab_nats_creds_dir }}"
    - "{{ lab_state }}/ssh"

# The password lookup writes the file on first use and reads it after.
- name: Generate the signing keys
  no_log: true
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{ lookup('ansible.builtin.password', lab_secrets_dir ~ '/' ~ item ~ ' length=64 chars=hexdigits') }}
  loop: [signing_key, agent_dummy_key]

# NATS runs in operator mode: an operator, its system account, and osapi's
# account with JetStream on, made once with nsc. Each osapi process then gets
# its own user in that account, made where it is deployed (user.yml), so adding
# a host never changes the server.
- name: Create the NATS operator and osapi's account
  ansible.builtin.shell: |
    set -eu
    n() { mise exec -C "{{ lab_root }}" -- nsc --data-dir "{{ lab_nsc_dir }}/stores" "$@"; }
    n add operator --name lab --sys --generate-signing-key
    n add account --name "{{ lab_nats_account }}"
    n edit account --name "{{ lab_nats_account }}" --js-enable 1
  args:
    creates: "{{ lab_nsc_dir }}/stores/lab/accounts/{{ lab_nats_account }}/{{ lab_nats_account }}.jwt"
  environment: "{{ lab_nsc_env }}"

# The server's half: the operator's JWT, the system account, and every account's
# JWT for a memory resolver. JWTs are signed, not secret. Written every run, so a
# change to an account reaches the hub.
- name: Write the NATS resolver config
  ansible.builtin.command:
    argv:
      - mise
      - exec
      - -C
      - "{{ lab_root }}"
      - --
      - nsc
      - --data-dir
      - "{{ lab_nsc_dir }}/stores"
      - generate
      - config
      - --mem-resolver
      - --sys-account
      - SYS
      - --force
      - --config-file
      - "{{ lab_nats_resolver }}"
  environment: "{{ lab_nsc_env }}"
  changed_when: false

- name: Check for a token
  ansible.builtin.stat:
    path: "{{ lab_secrets_dir }}/token"
  register: secrets_token

# The admin token is what the CLI, the hub's own client and the web UI send. It
# expires, and it is only good while the signing key that made it is the hub's.
# Thus every run checks the token against the current key, and signs a new one
# when it is missing, rejected, or expires within secrets_token_renew_days.
# osapi validates the whole config before any command, token commands included,
# so both use the hub's own config with a placeholder token.
- name: Sign or renew the admin token
  block:
    - name: Render a config to sign with
      ansible.builtin.template:
        src: "{{ lab_root }}/ansible/roles/hub/templates/hub.yaml.j2"
        dest: "{{ lab_state }}/token-signing.yaml"
        mode: "0600"
      vars:
        lab_token: pending
        hub_state: /nonexistent
      # A scratch file, removed below; it changes nothing that stays.
      changed_when: false

    - name: Validate the token against the signing key
      when: secrets_token.stat.exists
      ansible.builtin.command:
        argv:
          - "{{ lab_state }}/bin/osapi-darwin-arm64"
          - -f
          - "{{ lab_state }}/token-signing.yaml"
          - controller
          - token
          - validate
          - -t
          - "{{ lookup('ansible.builtin.file', lab_secrets_dir ~ '/token') }}"
      register: secrets_token_check
      changed_when: false
      failed_when: false
      no_log: true

    # validate says whether the key accepts the token. The days left come from
    # the token's own exp claim, not from validate's output, which is for people.
    - name: Decide whether the token needs signing
      ansible.builtin.set_fact:
        secrets_token_sign: >-
          {{ not secrets_token.stat.exists
             or secrets_token_check.rc != 0
             or ((secrets_token_exp | int) - (now().timestamp() | int)) // 86400
                < secrets_token_renew_days | int }}
      vars:
        secrets_token_payload: >-
          {{ lookup('ansible.builtin.file', lab_secrets_dir ~ '/token', errors='ignore')
             .split('.')[1] | default('') | replace('-', '+') | replace('_', '/') }}
        secrets_token_exp: "{{ ((secrets_token_payload ~ '==') | b64decode | from_json).exp | default(0) }}"
      no_log: true

    - name: Sign the token
      when: secrets_token_sign | bool
      ansible.builtin.command:
        argv:
          - "{{ lab_state }}/bin/osapi-darwin-arm64"
          - -f
          - "{{ lab_state }}/token-signing.yaml"
          - controller
          - token
          - generate
          - -r
          - admin
          - -u
          - lab
      register: secrets_token_out
      changed_when: true
      no_log: true

    - name: Save the token
      when: secrets_token_sign | bool
      ansible.builtin.copy:
        dest: "{{ lab_secrets_dir }}/token"
        content: "{{ secrets_token_out.stdout | regex_search('Token:\\s+(\\S+)', '\\1') | first }}"
        mode: "0600"
      no_log: true

  always:
    - name: Remove the signing config
      ansible.builtin.file:
        path: "{{ lab_state }}/token-signing.yaml"
        state: absent
      changed_when: false

- name: Create the VMs' SSH key
  community.crypto.openssh_keypair:
    path: "{{ lab_ssh_key }}"
    type: ed25519
    comment: osapi-lab
    mode: "0600"
