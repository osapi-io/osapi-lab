---
# osapi's NATS server on the hub, in operator mode, under launchd. It restarts
# when its binary, the config, the certificate, the NATS auth or the JetStream
# key is not the one it started on, or in a restart. hub_host runs first.

- name: Make the JetStream encryption key
  ansible.builtin.command:
    argv: "{{ lab_hub_cli + ['pki', 'key', 'create', '--name', 'jetstream'] }}"
  args:
    creates: "{{ lab_hub_state_abs }}/secrets/jetstream.key"

# NATS in operator mode does not load the global account, and stops at start
# when JetStream has state for it from a run before operator mode.
- name: Remove the global account that NATS does not load
  ansible.builtin.file:
    path: "{{ lab_hub_state_abs }}/jetstream/jetstream/$G"
    state: absent

- name: Run NATS under launchd
  ansible.builtin.include_role:
    name: launchd
  vars:
    launchd_label: "{{ lab_labels.nats }}"
    launchd_program_arguments: "{{ lab_hub_cli + ['nats', 'start'] }}"
    launchd_working_directory: "{{ lab_hub_state_abs }}"
    launchd_log: "{{ lab_hub_state_abs }}/log/nats.log"
    launchd_restart: "{{ lab_mode == 'restart' }}"
    launchd_inputs: "{{ lab_hub_inputs_common + [lab_hub_state_abs ~ '/secrets/jetstream.key'] }}"
    launchd_inputs_record: "{{ lab_hub_state_abs }}/run/nats.inputs"
