---
# osapi's controller on the hub, which serves the API and the UI, under
# launchd. It restarts when its binary, the config, the certificate or the
# NATS auth is not the one it started on, or in a restart. A deploy of the UI is a deploy of the
# controller, because osapi embeds the UI. hub_host runs first.

- name: Run the controller under launchd
  ansible.builtin.include_role:
    name: launchd
  vars:
    launchd_label: "{{ lab_labels.controller }}"
    launchd_program_arguments: "{{ lab_hub_cli + ['controller', 'start'] }}"
    launchd_working_directory: "{{ lab_hub_state_abs }}"
    launchd_log: "{{ lab_hub_state_abs }}/log/controller.log"
    launchd_restart: "{{ lab_mode == 'restart' }}"
    launchd_inputs: "{{ lab_hub_inputs_common }}"
    launchd_inputs_record: "{{ lab_hub_state_abs }}/run/controller.inputs"

# The controller answers once it reads its config and binds its port. A run
# that goes on to the agents asks it about them.
- name: Wait for the controller to answer
  ansible.builtin.command:
    argv: "{{ lab_hub_cli + ['client', 'health', 'liveness'] }}"
  register: controller_live
  until: controller_live.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  check_mode: false

- name: Keep the signing keys in the vault
  ansible.builtin.include_tasks: vault.yml
