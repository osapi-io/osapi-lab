---
# Jaeger on the hub, the one collector of the lab's traces, under launchd: the
# native darwin-arm64 binary of its release, pinned by checksum. It restarts
# when its binary, its config or the certificate is not the one it started on,
# or in a restart.

- name: Create the collector's directories
  ansible.builtin.file:
    path: "{{ lab_hub_state_abs }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [bin, config, log, run]

- name: Download the trace collector
  ansible.builtin.get_url:
    url: "{{ lab_tracing_url }}"
    dest: "{{ lab_hub_state_abs }}/bin/jaeger-{{ lab_tracing_version }}.tar.gz"
    checksum: "sha256:{{ lab_tracing_archive_sha256 }}"
    mode: "0644"

- name: Read the version of the unpacked trace collector
  ansible.builtin.command: cat {{ lab_hub_state_abs }}/bin/jaeger.version
  register: jaeger_unpacked
  changed_when: false
  failed_when: false
  check_mode: false

# It unpacks beside the binary and renames it over the binary: macOS stops a
# signed binary whose bytes change while it runs.
- name: Unpack the trace collector
  when: (jaeger_unpacked.stdout | default('') | trim) != lab_tracing_version
  ansible.builtin.shell: |
    set -euo pipefail
    bin={{ (lab_hub_state_abs ~ '/bin') | quote }}
    rm -rf "$bin/jaeger.unpack" && mkdir "$bin/jaeger.unpack"
    tar -xzf "$bin/jaeger-{{ lab_tracing_version }}.tar.gz" -C "$bin/jaeger.unpack" \
      --strip-components 1 "jaeger-{{ lab_tracing_version }}-darwin-arm64/jaeger"
    mv -f "$bin/jaeger.unpack/jaeger" "$bin/jaeger"
    rmdir "$bin/jaeger.unpack"
    echo {{ lab_tracing_version | quote }} > "$bin/jaeger.version"
  args:
    executable: /bin/bash
  changed_when: true

- name: Write the trace collector config
  ansible.builtin.template:
    src: jaeger.yaml.j2
    dest: "{{ lab_hub_state_abs }}/config/jaeger.yaml"
    mode: "0600"
  vars:
    hub_state: "{{ lab_hub_state_abs }}"

- name: Let the VMs reach the trace collector through the firewall
  ansible.builtin.include_role:
    name: firewall
    apply:
      tags: [firewall]
  vars:
    firewall_app: "{{ lab_hub_state_abs }}/bin/jaeger"
  tags: [firewall]

- name: Run the trace collector under launchd
  ansible.builtin.include_role:
    name: launchd
  vars:
    launchd_label: "{{ lab_labels.jaeger }}"
    launchd_program_arguments:
      - "{{ lab_hub_state_abs }}/bin/jaeger"
      - --config
      - "{{ lab_hub_state_abs }}/config/jaeger.yaml"
    launchd_working_directory: "{{ lab_hub_state_abs }}"
    launchd_log: "{{ lab_hub_state_abs }}/log/jaeger.log"
    launchd_restart: "{{ lab_mode == 'restart' }}"
    launchd_inputs:
      - "{{ lab_hub_state_abs }}/bin/jaeger"
      - "{{ lab_hub_state_abs }}/config/jaeger.yaml"
      - "{{ lab_hub_state_abs }}/tls/api.crt"
      - "{{ lab_hub_state_abs }}/tls/api.key"
    launchd_inputs_record: "{{ lab_hub_state_abs }}/run/jaeger.inputs"
