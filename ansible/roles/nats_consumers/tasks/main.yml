---
# Checks that each running agent has its consumers on the jobs stream
# (osapi-io/osapi-lab#45).
#
# Each agent makes durable consumers on the jobs stream, and each name ends with
# `_<machine id>`. A deploy replaces VMs, and each new VM is a new machine ID,
# so the consumers of the old VMs stay. On 23 November 2026 the stream held
# 1000, the account limit; the new agents could not make theirs, and each job
# failed. osapi-io/osapi#1154 makes NATS remove an idle consumer by itself, so
# the lab removes none: its nats CLI connects as the controller's user, which
# may list the consumers and not delete them.
# Runs on the machine running Ansible, with the nats CLI as the cli user.

- name: List the running agents
  ansible.builtin.command:
    argv: ["{{ lab_state }}/bin/osapi", -f, "{{ lab_state }}/config/cli.yaml", client, agent, list, --json]
  register: nats_consumers_agents
  changed_when: false
  check_mode: false

- name: List the consumers of the jobs stream
  ansible.builtin.command:
    argv: [nats, consumer, ls, "{{ nats_consumers_stream }}", -n]
  register: nats_consumers_list
  changed_when: false
  check_mode: false

- name: Read the machine IDs of the running agents
  ansible.builtin.set_fact:
    nats_consumers_ids: "{{ (nats_consumers_agents.stdout | from_json)['items'] | map(attribute='machine_id') | select | list }}"

- name: Check that each running agent has its consumers
  ansible.builtin.assert:
    that:
      - nats_consumers_list.stdout_lines | select('search', '_' ~ item ~ '$') | list | length > 0
    fail_msg: >-
      The agent with machine ID {{ item }} has no consumer on {{ nats_consumers_stream }}, so it
      gets no jobs. Look at its log for a consumer error, such as the stream's consumer limit.
    quiet: true
  loop: "{{ nats_consumers_ids }}"
