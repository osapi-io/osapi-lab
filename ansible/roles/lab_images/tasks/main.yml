---
# Bakes one image for each VM of lab_images_vms that needs one: the whole VM,
# with its osapi build, config, NATS credential, hostname and packages.
# packer/lab.pkr.hcl bakes it with Packer's own provisioners; this role makes
# what must exist outside the image, the VM's NATS user, and runs one build for
# each VM. Runs on the hub.

- name: Check there is a build to bake
  ansible.builtin.assert:
    that: lab_build_tag | length > 0
    fail_msg: No linux build in .lab/bin. Run `just build`.
    quiet: true
- name: Fingerprint the packer directory
  ansible.builtin.include_tasks: fingerprint.yml

# A distribution with no Tart image to pull has a directory under
# packer/bases. Its local image is named for what the directory holds, so
# a change to the source or the seed makes a new one.
- name: Fingerprint each base under packer/bases
  delegate_to: localhost
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ lab_root }}/packer/bases"
    for dir in */; do
      dir=${dir%/}
      sum=$(find "$dir" -type f | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -c1-16)
      echo "$dir base-$dir-$sum"
    done
  args:
    executable: /bin/bash
  register: lab_images_bases_sum
  changed_when: false
  check_mode: false
- name: Name the local base of each distribution that has one
  ansible.builtin.set_fact:
    lab_images_bases: "{{ dict(lab_images_bases_sum.stdout_lines | map('split', ' ') | list) }}"
- name: Name what each image is baked from
  ansible.builtin.set_fact:
    lab_images_fingerprint: "{{ lab_build_fingerprint }}-{{ lab_images_packer_sum.stdout }}"
- name: List the images on the hub
  ansible.builtin.command: tart list --quiet --source local
  register: lab_images_present
  changed_when: false
  check_mode: false
- name: Read the fingerprint each image was baked from
  ansible.builtin.command: cat {{ lab_hub_state_abs }}/images/img-{{ item.name }}-{{ lab_build_tag }}.fingerprint
  loop: "{{ lab_images_vms }}"
  loop_control:
    label: "{{ item.name }}"
  register: lab_images_baked
  changed_when: false
  failed_when: false
  check_mode: false
# A VM that upgrades in place clones its image one time. While the VM
# exists, it needs no new image: a bump copies each build into it. lab_images_rebuild=true bakes it again, for `just rebuild`.
- name: Choose the images to build
  vars:
    lab_images_kept: >-
      {{ lab_images_vms | selectattr('name', 'in', lab_in_place)
         | selectattr('name', 'in', lab_images_present.stdout_lines | select('match', '^lab-')
                                    | map('regex_replace', '^lab-', '') | list)
         | list }}
    lab_images_stale: >-
      {{ lab_images_baked.results | rejectattr('stdout', 'equalto', lab_images_fingerprint)
         | map(attribute='item') | list }}
    lab_images_missing: >-
      {{ lab_images_vms | rejectattr('name', 'in', lab_images_present.stdout_lines
                                            | map('regex_replace', '^img-', '')
                                            | map('regex_replace', '-' ~ lab_build_tag ~ '$', '') | list) | list }}
  ansible.builtin.set_fact:
    lab_images_wanted: >-
      {{ lab_images_vms if (lab_images_rebuild | bool)
         else (lab_images_stale + lab_images_missing) | unique | reject('in', lab_images_kept) | list }}

- name: Create the image records directory
  ansible.builtin.file:
    path: "{{ lab_hub_state_abs }}/images"
    state: directory
    mode: "0700"
- name: Copy the linux build to the hub
  when: lab_images_wanted | length > 0
  ansible.builtin.copy:
    src: "{{ lab_state }}/bin/osapi-linux-arm64"
    dest: "{{ lab_hub_state_abs }}/bin/osapi-linux-arm64"
    mode: "0755"
# Each image bakes a join token that admits one agent, its VM, with the
# distro as a label: the VM joins at its first boot, minutes after the bake.
- name: Make the join token of each VM
  ansible.builtin.command:
    argv: >-
      {{ lab_hub_cli + ['controller', 'join', 'token', 'create', '--expires', lab_join_expires,
                        '--uses', '1', '--labels', 'distro=' ~ item.image, '--json'] }}
  loop: "{{ lab_images_wanted }}"
  loop_control:
    label: "{{ item.name }}"
  register: lab_images_join
  changed_when: true
  no_log: true

- name: Delete the images being rebuilt
  ansible.builtin.command: tart delete img-{{ item.name }}-{{ lab_build_tag }}
  loop: "{{ lab_images_wanted }}"
  loop_control:
    label: "{{ item.name }}"
  when: ('img-' ~ item.name ~ '-' ~ lab_build_tag) in lab_images_present.stdout_lines
  changed_when: true
- name: Make the local base of each distribution that has one
  ansible.builtin.include_role:
    name: tart_base
  vars:
    tart_base_name: "{{ lab_images_bases[lab_images_base] }}"
    tart_base_prefix: base-{{ lab_images_base }}-
    tart_base_source_dir: "{{ lab_root }}/packer/bases/{{ lab_images_base }}"
    tart_base_work_dir: "{{ lab_hub_state_abs }}/bases/{{ lab_images_base }}"
  loop: "{{ lab_images_wanted | map(attribute='image') | unique | select('in', lab_images_bases) | list }}"
  # The role loops too; its loop must not reuse this loop's variable,
  # because these vars are evaluated lazily inside it.
  loop_control:
    loop_var: lab_images_base
- name: Build the image of each VM
  ansible.builtin.include_role:
    name: packer
  vars:
    packer_template_dir: "{{ lab_root }}/packer"
    packer_dest: "{{ lab_hub_state_abs }}/packer"
    packer_vars:
      vm: "{{ item.name }}"
      distro: "{{ item.image }}"
      base_image: "{{ lab_images_bases[item.image] | default('') }}"
      image_tag: "{{ lab_build_tag }}"
      revision: "{{ lab_build_revision }}"
      osapi_binary: "{{ lab_hub_state_abs }}/bin/osapi-linux-arm64"
      ssh_pubkey: "{{ lookup('ansible.builtin.file', lab_ssh_key ~ '.pub') }}"
      nats_port: "{{ lab_nats_port }}"
      tracing_port: "{{ lab_tracing_otlp_port }}"
      hub_name: "{{ lab_hub_addr }}"
    # The join string goes in the environment, so it is in no argument list
    # on the hub and no log of this run.
    packer_env:
      PKR_VAR_join: >-
        {{ ((lab_images_join.results | selectattr('item.name', 'equalto', item.name) | first).stdout
            | from_json)['join'] | regex_replace('^tls://[^:/?]+:[0-9]+', lab_vm_nats_url) }}
  loop: "{{ lab_images_wanted }}"
  loop_control:
    label: "{{ item.name }}"
# current.yml reads it: a bump copies a build into a VM, so it must not run
# when the packer directory changed since the VM's image was baked. Each VM
# has its own record, because a run can bake the images of some VMs only. A
# VM whose image this run did not bake keeps its record, or gets one when its
# image is current.
- name: Record the packer directory that each VM's image is baked from
  vars:
    lab_images_current: >-
      {{ lab_images_baked.results | selectattr('stdout', 'equalto', lab_images_fingerprint)
         | map(attribute='item') | list }}
  ansible.builtin.copy:
    dest: "{{ lab_hub_state_abs }}/images/{{ item.name }}.packer.sum"
    content: "{{ lab_images_packer_sum.stdout }}\n"
    mode: "0644"
  loop: "{{ (lab_images_wanted + lab_images_current) | unique | list }}"
  loop_control:
    label: "{{ item.name }}"
- name: Record the fingerprint each image was baked from
  ansible.builtin.copy:
    dest: "{{ lab_hub_state_abs }}/images/img-{{ item.name }}-{{ lab_build_tag }}.fingerprint"
    content: "{{ lab_images_fingerprint }}"
    mode: "0644"
  loop: "{{ lab_images_wanted }}"
  loop_control:
    label: "{{ item.name }}"
# An image that a build recorded in the last hour stays, also when this
# build does not clone it: it can be the image of a run that broke the
# lock, or that a VM is cloned from now (osapi-io/osapi-lab#38).
- name: Find the images that no VM of this build clones, and no build recorded in the last hour
  when: lab_images_prune | bool
  ansible.builtin.shell: |
    set -u
    for image in {{ lab_images_prunable | join(' ') }}; do
      record="{{ lab_hub_state_abs }}/images/$image.fingerprint"
      if [ -f "$record" ] && [ -n "$(find "$record" -mmin -60)" ]; then
        continue
      fi
      echo "$image"
    done
  vars:
    lab_images_prunable: >-
      {{ lab_images_present.stdout_lines | select('match', '^img-')
         | reject('in', lab_vms | map(attribute='name')
                        | map('regex_replace', '^(.*)$', 'img-\\1-' ~ lab_build_tag) | list) | list }}
  register: lab_images_old
  changed_when: false
  check_mode: false
- name: Delete the images that no VM of this build clones
  when: lab_images_prune | bool
  ansible.builtin.command: tart delete {{ item }}
  loop: "{{ lab_images_old.stdout_lines | default([]) }}"
  changed_when: true
