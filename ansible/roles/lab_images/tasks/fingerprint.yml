---
# The checksum of packer/, which an image records it was baked from, and
# which a bump checks against what the images were baked from.
- name: Fingerprint the packer directory
  delegate_to: localhost
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ lab_root }}/packer"
    find . -type f ! -path './.packer*' | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -c1-16
  args:
    executable: /bin/bash
  register: lab_images_packer_sum
  changed_when: false
  check_mode: false
