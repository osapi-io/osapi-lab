---
# /etc/osapi-lab/image keeps the image that the VM was cloned from; revision is
# the build that it runs now, which `just list` shows.
- name: Record the build that the VM runs
  ansible.builtin.lineinfile:
    path: /etc/osapi-lab/image
    regexp: ^revision=
    line: revision={{ lab_build_revision }}

- name: Restart the agent
  ansible.builtin.systemd_service:
    name: osapi-agent
    state: restarted
    daemon_reload: true
