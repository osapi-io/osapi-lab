---
- name: Find the hub's home
  ansible.builtin.command: printenv HOME
  register: hub_home
  changed_when: false
  check_mode: false

- name: Resolve the hub's state directory
  ansible.builtin.set_fact:
    hub_state: "{{ hub_state_dir | regex_replace('^~', hub_home.stdout) }}"

- name: Create the hub's directories
  ansible.builtin.file:
    path: "{{ hub_state }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [bin, config, log, secrets]

# copy writes a temporary file and renames it over the target, so the running
# binary keeps its own inode; macOS kills one whose bytes change in place.
- name: Copy the darwin build
  ansible.builtin.copy:
    src: "{{ lab_state }}/bin/osapi-darwin-arm64"
    dest: "{{ hub_state }}/bin/osapi-darwin-arm64"
    mode: "0755"
  register: hub_binary

# Each process on the hub is its own user in osapi's NATS account: the server,
# for its setup and heartbeat, and the controller.
- name: Make the hub's NATS users
  ansible.builtin.include_role:
    name: secrets
    tasks_from: user
  vars:
    secrets_nats_user: "{{ item }}"
  loop: [nats, controller]

- name: Copy the hub's NATS credentials
  ansible.builtin.copy:
    src: "{{ lab_nats_creds_dir }}/{{ item }}.creds"
    dest: "{{ hub_state }}/secrets/{{ item }}.creds"
    mode: "0600"
  loop: [nats, controller]
  register: hub_creds

- name: Copy the NATS resolver config
  ansible.builtin.copy:
    src: "{{ lab_nats_resolver }}"
    dest: "{{ hub_state }}/config/resolver.conf"
    mode: "0600"
  register: hub_resolver

- name: Render the hub's config
  ansible.builtin.template:
    src: hub.yaml.j2
    dest: "{{ hub_state }}/config/hub.yaml"
    mode: "0600"
  register: hub_config

- name: Let agents reach NATS through the firewall
  ansible.builtin.include_role:
    name: firewall
    apply:
      tags: [firewall]
  vars:
    firewall_app: "{{ hub_state }}/bin/osapi-darwin-arm64"
  tags: [firewall]

# Jaeger before the processes that send to it. docker run publishes OTLP on every
# interface, for the VMs, and the UI on loopback only.
- name: Check for the trace collector
  ansible.builtin.command: docker inspect --format {% raw %}'{{ .Config.Image }} {{ .State.Running }}'{% endraw %} {{ lab_tracing_container }}
  register: hub_tracing
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove a trace collector on another image
  when:
    - hub_tracing.rc == 0
    - not hub_tracing.stdout.startswith(lab_tracing_image ~ ' ')
  ansible.builtin.command: docker rm -f {{ lab_tracing_container }}
  changed_when: true

- name: Run the trace collector
  when: hub_tracing.rc != 0 or not hub_tracing.stdout.startswith(lab_tracing_image ~ ' ')
  ansible.builtin.command: >-
    docker run -d --name {{ lab_tracing_container }} --restart unless-stopped
    -p {{ lab_tracing_otlp_port }}:4317
    -p 127.0.0.1:{{ lab_tracing_ui_port }}:16686
    {{ lab_tracing_image }}
  changed_when: true

- name: Start the trace collector
  when:
    - hub_tracing.rc == 0
    - hub_tracing.stdout == lab_tracing_image ~ ' false'
  ansible.builtin.command: docker start {{ lab_tracing_container }}
  changed_when: true

# NATS first: osapi's server creates its streams and buckets as it starts, and
# the controller needs them.
- name: Run NATS and the controller under launchd
  ansible.builtin.include_role:
    name: launchd
  vars:
    launchd_label: "{{ hub_label_prefix }}.{{ item.name }}"
    launchd_program_arguments: "{{ [hub_state ~ '/bin/osapi-darwin-arm64', '-f', hub_state ~ '/config/hub.yaml'] + item.command }}"
    launchd_working_directory: "{{ hub_state }}"
    launchd_log: "{{ hub_state }}/log/{{ item.name }}.log"
    launchd_restart: >-
      {{ hub_binary is changed or hub_config is changed or hub_creds is changed
         or hub_resolver is changed or (hub_restart | default(false) | bool) }}
  loop:
    - { name: nats, command: [nats, server, start] }
    - { name: controller, command: [controller, start] }
  loop_control:
    label: "{{ item.name }}"
