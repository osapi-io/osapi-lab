---
- name: Find the hub's home
  ansible.builtin.command: printenv HOME
  register: hub_home
  changed_when: false
  check_mode: false

- name: Resolve the hub's state directory
  ansible.builtin.set_fact:
    hub_state: "{{ hub_state_dir | regex_replace('^~', hub_home.stdout) }}"

- name: Create the hub's directories
  ansible.builtin.file:
    path: "{{ hub_state }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [bin, config, log, secrets]

# copy writes a temporary file and renames it over the target, so the running
# binary keeps its own inode; macOS kills one whose bytes change in place.
- name: Copy the darwin build
  ansible.builtin.copy:
    src: "{{ lab_state }}/bin/osapi-darwin-arm64"
    dest: "{{ hub_state }}/bin/osapi-darwin-arm64"
    mode: "0755"
  register: hub_binary

# Each process on the hub is its own user in osapi's NATS account: the server,
# for its setup and heartbeat, and the controller.
- name: Make the hub's NATS users
  ansible.builtin.include_role:
    name: secrets
    tasks_from: user
  vars:
    secrets_nats_user: "{{ item }}"
  loop: [nats, controller]

- name: Copy the hub's NATS credentials
  ansible.builtin.copy:
    src: "{{ lab_nats_creds_dir }}/{{ item }}.creds"
    dest: "{{ hub_state }}/secrets/{{ item }}.creds"
    mode: "0600"
  loop: [nats, controller]
  register: hub_creds

- name: Copy the NATS resolver config
  ansible.builtin.copy:
    src: "{{ lab_nats_resolver }}"
    dest: "{{ hub_state }}/config/resolver.conf"
    mode: "0600"
  register: hub_resolver

- name: Render the hub's config
  ansible.builtin.template:
    src: hub.yaml.j2
    dest: "{{ hub_state }}/config/hub.yaml"
    mode: "0600"
  register: hub_config

# The key that encrypts the JetStream store. creates keeps the first key: a
# new key in its place makes each stream unreadable. The server encrypts the
# plain store of an earlier deploy as it loads it.
- name: Make the JetStream encryption key
  ansible.builtin.command:
    argv:
      - "{{ hub_state }}/bin/osapi-darwin-arm64"
      - -f
      - "{{ hub_state }}/config/hub.yaml"
      - nats
      - key
      - create
  args:
    creates: "{{ hub_state }}/secrets/jetstream.key"
  register: hub_jetstream_key

# The global account of the store from before the hub used operator mode. NATS
# never loads it, so it stays plain when the store is encrypted. Nothing reads
# it, so the role removes it.
- name: Remove the global account that NATS does not load
  ansible.builtin.file:
    path: "{{ hub_state }}/jetstream/jetstream/$G"
    state: absent

- name: Let agents reach NATS through the firewall
  ansible.builtin.include_role:
    name: firewall
    apply:
      tags: [firewall]
  vars:
    firewall_app: "{{ hub_state }}/bin/osapi-darwin-arm64"
  tags: [firewall]

# Jaeger before the processes that send to it. It runs as a native binary
# under launchd, like NATS and the controller, so the hub needs no Docker.
- name: Download the trace collector
  ansible.builtin.get_url:
    url: "{{ lab_tracing_url }}"
    dest: "{{ hub_state }}/bin/jaeger-{{ lab_tracing_version }}.tar.gz"
    checksum: "sha256:{{ lab_tracing_archive_sha256 }}"
    mode: "0644"
  register: hub_jaeger_archive

# BSD tar on macOS extracts one member; ansible's unarchive needs GNU tar for
# include.
- name: Unpack the trace collector
  ansible.builtin.command:
    argv:
      - tar
      - -xzf
      - "{{ hub_state }}/bin/jaeger-{{ lab_tracing_version }}.tar.gz"
      - -C
      - "{{ hub_state }}/bin"
      - --strip-components
      - "1"
      - "jaeger-{{ lab_tracing_version }}-darwin-arm64/jaeger"
  args:
    creates: "{{ hub_state }}/bin/jaeger"
  register: hub_jaeger_binary

- name: Write the trace collector config
  ansible.builtin.template:
    src: jaeger.yaml.j2
    dest: "{{ hub_state }}/config/jaeger.yaml"
    mode: "0600"
  register: hub_jaeger_config

- name: Let the VMs reach the trace collector through the firewall
  ansible.builtin.include_role:
    name: firewall
    apply:
      tags: [firewall]
  vars:
    firewall_app: "{{ hub_state }}/bin/jaeger"
  tags: [firewall]

- name: Run the trace collector under launchd
  ansible.builtin.include_role:
    name: launchd
  vars:
    launchd_label: "{{ hub_label_prefix }}.jaeger"
    launchd_program_arguments:
      - "{{ hub_state }}/bin/jaeger"
      - --config
      - "{{ hub_state }}/config/jaeger.yaml"
    launchd_working_directory: "{{ hub_state }}"
    launchd_log: "{{ hub_state }}/log/jaeger.log"
    launchd_restart: "{{ hub_jaeger_binary is changed or hub_jaeger_config is changed }}"

# NATS first: osapi's server creates its streams and buckets as it starts, and
# the controller needs them.
- name: Run NATS and the controller under launchd
  ansible.builtin.include_role:
    name: launchd
  vars:
    launchd_label: "{{ hub_label_prefix }}.{{ item.name }}"
    launchd_program_arguments: "{{ [hub_state ~ '/bin/osapi-darwin-arm64', '-f', hub_state ~ '/config/hub.yaml'] + item.command }}"
    launchd_working_directory: "{{ hub_state }}"
    launchd_log: "{{ hub_state }}/log/{{ item.name }}.log"
    launchd_restart: >-
      {{ hub_binary is changed or hub_config is changed or hub_creds is changed
         or hub_resolver is changed or hub_jetstream_key is changed
         or (hub_restart | default(false) | bool) }}
  loop:
    - { name: nats, command: [nats, start] }
    - { name: controller, command: [controller, start] }
  loop_control:
    label: "{{ item.name }}"
