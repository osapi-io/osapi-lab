---
# The start of each agent process before the run restarts any, so main.yml can
# wait for a new one. Runs on the hub.
- name: List the agents before the restart
  ansible.builtin.command:
    argv: "{{ lab_hub_cli + ['client', 'agent', 'list', '--json'] }}"
  register: fleet_ready_before
  changed_when: false
  failed_when: false
  check_mode: false
