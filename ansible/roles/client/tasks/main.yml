---
- name: Create the config directory
  ansible.builtin.file:
    path: "{{ lab_state }}/config"
    state: directory
    mode: "0700"

- name: Render the client config
  ansible.builtin.template:
    src: cli.yaml.j2
    dest: "{{ lab_state }}/config/cli.yaml"
    mode: "0600"

# The nats CLI in this directory, through .envrc, connects as the controller's
# user: it reads the lab's streams, buckets and consumers as osapi does. The
# lab has no user with more: osapi nats auth operator create makes one for
# each osapi role, and no system user.
- name: Copy the controller's credentials for the nats CLI
  ansible.builtin.fetch:
    src: "{{ hostvars[lab_hub].lab_hub_nats_dir }}/controller.creds"
    dest: "{{ lab_nats_creds_dir }}/cli.creds"
    flat: true
  delegate_to: "{{ lab_hub }}"

# fetch has no mode: the file gets the umask's mode.
- name: Let only this user read the credentials
  ansible.builtin.file:
    path: "{{ lab_nats_creds_dir }}/cli.creds"
    mode: "0600"

- name: Write the nats CLI's environment
  ansible.builtin.copy:
    dest: "{{ lab_state }}/config/nats.env"
    content: |
      NATS_URL=tls://{{ lab_hub_addr }}:{{ lab_nats_port }}
      NATS_CREDS={{ lab_nats_creds_dir }}/cli.creds
    mode: "0600"

# The remote agent, `just agent`, joins as a VM does, with a token of its own,
# and keeps what the join gave it in its key_dir. Its join string dials the
# hub's tailnet name, as the controller's join URL says.
- name: Create the remote agent's key directory
  ansible.builtin.file:
    path: "{{ client_remote_key_dir }}"
    state: directory
    mode: "0700"

- name: Check whether the remote agent joined
  ansible.builtin.stat:
    path: "{{ client_remote_key_dir }}/nats-join.json"
  register: client_remote_joined

# A token lives lab_join_expires, and the config that holds it is written
# with it. Until the agent joins, a run keeps a config whose token is still
# good, rather than mint a new one-use token each run (osapi-io/osapi-lab#90).
# An hour of margin leaves `just agent` time to use it.
- name: Check the remote agent's config
  when: not client_remote_joined.stat.exists
  ansible.builtin.stat:
    path: "{{ lab_state }}/config/agent-remote.yaml"
  register: client_remote_config

- name: Decide whether the remote agent needs a new token
  when: not client_remote_joined.stat.exists
  ansible.builtin.set_fact:
    client_remote_mint: >-
      {{ not client_remote_config.stat.exists
         or (now().timestamp() - client_remote_config.stat.mtime)
            > (lab_join_expires | regex_replace('h$', '') | int - 1) * 3600 }}

# `just stop controller` and `just ssh` run this role with the controller
# down. The remote agent's config then waits for a run with the controller up.
- name: Check whether the controller answers
  when:
    - not client_remote_joined.stat.exists
    - client_remote_mint | bool
  ansible.builtin.command:
    argv: "{{ hostvars[lab_hub].lab_hub_cli + ['client', 'health', 'liveness'] }}"
  delegate_to: "{{ lab_hub }}"
  register: client_controller_live
  changed_when: false
  failed_when: false
  check_mode: false

- name: Say that the remote agent's config waits for the controller
  when:
    - not client_remote_joined.stat.exists
    - client_remote_mint | bool
    - client_controller_live.rc != 0
  ansible.builtin.debug:
    msg: >-
      The controller does not answer, so this run writes no config for
      `just agent`. A run with the controller up writes it.

- name: Make the remote agent's join token
  when:
    - not client_remote_joined.stat.exists
    - client_remote_mint | bool
    - client_controller_live.rc == 0
  ansible.builtin.command:
    argv: >-
      {{ hostvars[lab_hub].lab_hub_cli + ['controller', 'join', 'token', 'create',
         '--expires', lab_join_expires, '--uses', '1', '--labels', 'distro=' ~ client_distro, '--json'] }}
  delegate_to: "{{ lab_hub }}"
  register: client_remote_token
  changed_when: true
  no_log: true

- name: Render the remote agent config
  when:
    - not client_remote_joined.stat.exists
    - client_remote_mint | bool
    - client_controller_live.rc == 0
  ansible.builtin.template:
    src: agent.yaml.j2
    dest: "{{ lab_state }}/config/agent-remote.yaml"
    mode: "0600"
  vars:
    agent_distro: "{{ client_distro }}"
    agent_key_dir: "{{ client_remote_key_dir }}"
    agent_join: >-
      {{ (client_remote_token.stdout | from_json)['join'] }}
  no_log: true

# `ssh -F .lab/ssh/config <vm>` reaches a VM through the hub; scp and rsync
# take the same file. Written only when this run found the VMs.
- name: Write the lab's SSH config
  when: groups['vms'] | default([]) | length > 0
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ lab_state }}/ssh/config"
    mode: "0600"
