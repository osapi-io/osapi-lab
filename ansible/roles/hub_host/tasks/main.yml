---
# What NATS and the controller share on the hub: the state directories, the
# darwin build, the config that both read, and the firewall entry of the build.
# hub_tls gets the certificate that they serve. nats_server and controller start
# their process, and restart it when a file that it reads at its start is not
# the one it started on.

- name: Create the hub's directories
  ansible.builtin.file:
    path: "{{ lab_hub_state_abs }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [bin, config, log, run, secrets]

# copy writes a temporary file and renames it over the target: macOS kills a
# signed binary whose bytes change while it runs, and a new inode keeps the
# running process alive until its restart. A restart copies nothing.
- name: Copy the darwin build
  when: lab_mode != 'restart'
  ansible.builtin.copy:
    src: "{{ lab_state }}/bin/osapi-darwin-arm64"
    dest: "{{ lab_hub_state_abs }}/bin/osapi-darwin-arm64"
    mode: "0755"

# The NATS operator, its accounts, the scoped signing keys of the join and a
# credentials file for each osapi role, made one time on the hub. The keys
# stay on the hub. A teardown removes them, and the next deploy makes new ones
# and new VMs that join with them.
- name: Make the NATS auth of the lab
  ansible.builtin.command:
    argv: "{{ lab_hub_cli[:1] + ['nats', 'auth', 'operator', 'create', '--out', lab_hub_nats_dir] }}"
  args:
    creates: "{{ lab_hub_nats_dir }}/resolver.conf"

# The signing keys are in the controller's vault after its first run: the
# config then refers to them, and has no key in it (osapi-io/osapi-lab#54).
# The record is in the store of the vault, so it goes with the store.
- name: Check whether the vault holds the signing keys
  ansible.builtin.stat:
    path: "{{ lab_vault_marker }}"
  register: hub_host_in_vault

- name: Render the hub's config
  ansible.builtin.include_tasks: config.yml
  vars:
    hub_host_signing_in_vault: "{{ hub_host_in_vault.stat.exists }}"

- name: Let agents reach NATS through the firewall
  ansible.builtin.include_role:
    name: firewall
    apply:
      tags: [firewall]
  vars:
    firewall_app: "{{ lab_hub_state_abs }}/bin/osapi-darwin-arm64"
  tags: [firewall]
